# Baut MARGIN CALL fuer Windows, macOS und Linux (Desktop-App) sowie die Cardputer-Firmware.
# Ergebnis: je Plattform eine Datei unter "Actions" -> letzter Lauf -> "Artifacts".
# Bei einem Tag wie v3.4.0 entsteht zusaetzlich ein GitHub-Release mit allen Dateien.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --no-bundle
          - os: ubuntu-22.04
            name: Linux
            args: --bundles appimage
          - os: macos-latest
            name: macOS
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    env:
      # Code-Signatur fuer Windows ueber die SignPath Foundation (siehe CODE_SIGNING_POLICY.md).
      # Laeuft nur bei Versions-Tags und nur, wenn das Secret SIGNPATH_API_TOKEN hinterlegt ist.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGN_WINDOWS: ${{ matrix.name == 'Windows' && startsWith(github.ref, 'refs/tags/v') }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux-Pakete
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm install --no-fund --no-audit

      - run: npx tauri build ${{ matrix.args }}

      - name: Datei einsammeln
        shell: bash
        run: |
          mkdir -p out
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "${{ matrix.name }}" in
            Windows) cp src-tauri/target/release/margincall.exe "out/MarginCall-$VER-Windows.exe" ;;
            Linux)   cp src-tauri/target/release/bundle/appimage/*.AppImage "out/MarginCall-$VER-Linux.AppImage" ;;
            macOS)   cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/MarginCall-$VER-macOS.dmg" ;;
          esac
          ls -la out

      # ---- Windows-EXE signieren (SignPath Foundation, manuelle Freigabe im SignPath-Portal)
      - name: Unsignierte EXE fuer SignPath bereitstellen
        id: unsigned
        if: env.SIGN_WINDOWS == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: MarginCall-Windows-unsigned
          path: desktop/out/*.exe

      - name: Signieren lassen (wartet auf Freigabe)
        if: env.SIGN_WINDOWS == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'margincall' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: desktop/signed

      - name: Signierte EXE uebernehmen
        if: env.SIGN_WINDOWS == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: |
          cp -f signed/*.exe out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MarginCall-${{ matrix.name }}
          path: desktop/out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/out/*
          body: |
            Downloads für Windows, macOS, Linux und den M5Stack Cardputer ADV – siehe Assets unten.

            Code signing: Free code signing provided by SignPath.io, certificate by SignPath Foundation (Windows-EXE).
            Changes / Änderungen: [CHANGELOG (English)](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) · [Deutsch](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.de.md) ·
            [Code signing policy](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md) ·
            [Datenschutz](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md#privacy-policy--datenschutz)

  cardputer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Firmware bauen
        env:
          PLATFORMIO_BUILD_DIR: ${{ github.workspace }}/.pio/build
          PLATFORMIO_LIBDEPS_DIR: ${{ github.workspace }}/.pio/libdeps
        run: |
          sed -i '/^build_dir\|^libdeps_dir/d' platformio.ini
          pio run
          VER=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          mkdir -p out && cp .pio/build/cardputer-adv/firmware.bin "out/MarginCall-$VER-Cardputer.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: MarginCall-Cardputer
          path: out/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          append_body: true
