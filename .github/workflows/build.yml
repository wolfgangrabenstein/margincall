# Baut MARGIN CALL fuer Windows, macOS und Linux (Desktop-App) sowie die Cardputer-Firmware.
# Ergebnis: je Plattform eine Datei unter "Actions" -> letzter Lauf -> "Artifacts".
# Bei einem Tag wie v3.4.0 entsteht zusaetzlich ein GitHub-Release mit allen Dateien.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --no-bundle
          - os: ubuntu-22.04
            name: Linux
            args: --bundles appimage
          - os: macos-latest
            name: macOS
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux-Pakete
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm install --no-fund --no-audit

      - run: npx tauri build ${{ matrix.args }}

      - name: Datei einsammeln
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.name }}" in
            Windows) cp src-tauri/target/release/margincall.exe out/MarginCall-Windows.exe ;;
            Linux)   cp src-tauri/target/release/bundle/appimage/*.AppImage out/MarginCall-Linux.AppImage ;;
            macOS)   cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/MarginCall-macOS.dmg ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MarginCall-${{ matrix.name }}
          path: desktop/out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/out/*

  cardputer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Firmware bauen
        env:
          PLATFORMIO_BUILD_DIR: ${{ github.workspace }}/.pio/build
          PLATFORMIO_LIBDEPS_DIR: ${{ github.workspace }}/.pio/libdeps
        run: |
          sed -i '/^build_dir\|^libdeps_dir/d' platformio.ini
          pio run
          mkdir -p out && cp .pio/build/cardputer-adv/firmware.bin out/MarginCall-Cardputer.bin
      - uses: actions/upload-artifact@v4
        with:
          name: MarginCall-Cardputer
          path: out/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
