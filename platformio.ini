; MARGIN CALL - Boersen-Raycaster fuer M5Stack Cardputer ADV
[platformio]
; kurzer Pfad gegen das 260-Zeichen-Limit von Windows
build_dir = C:/mcbuild/build
libdeps_dir = C:/mcbuild/libdeps

[env:cardputer-adv]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
build_flags =
  -O2
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0
build_unflags = -Os
lib_deps =
  m5stack/M5GFX@>=0.2.27
  m5stack/M5Unified@>=0.2.8
  https://github.com/m5stack/M5Cardputer.git#1.2.0
