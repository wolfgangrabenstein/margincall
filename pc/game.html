<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070d">
<title>MARGIN CALL</title>
<style>
  :root {
    /* Layout: ein einziger Spielschirm, zentriert auf dunklem Handelssaal-Hintergrund */
    --bg: #05070d;
    --panel: #0b1120;
    --line: #1e7a46;
    --text: #d8e0f0;
    --muted: #6b7896;
    --gold: #ffd23a;
    --font-ui: "Consolas", "Lucida Console", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-inline: 16px; box-sizing: border-box; overflow: hidden;
  }
  #screen {
    width: min(100%, calc((100vh - 60px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9;
    image-rendering: pixelated; background: #000; border: 2px solid var(--line); border-radius: 6px;
    cursor: crosshair;
  }
  #hint { color: var(--muted); font-size: 12px; margin-top: 8px; text-align: center; }
  /* Smartphone: Steuerung nur waehrend des Spiels ueber dem Bild (linke Haelfte = Stick, rechte Haelfte = Drehen) */
  #touch { display: none; position: fixed; inset: 0; z-index: 5; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.playing #touch { display: block; }
  #stickBase { display: none; position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.07); pointer-events: none; }
  #stickKnob { position: absolute; left: 35px; top: 35px; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.38); }
  #touch button { position: absolute; border-radius: 50%; font: 700 15px var(--font-ui); touch-action: none; color: var(--text);
    background: rgba(11,17,32,.55); border: 2px solid rgba(255,255,255,.3); }
  #touch #tFire { right: calc(22px + env(safe-area-inset-right, 0px)); bottom: 28%; width: 108px; height: 108px;
    background: rgba(170,30,30,.55); border-color: rgba(255,210,58,.8); color: var(--gold); font-size: 17px; }
  #touch #tDodge { right: calc(146px + env(safe-area-inset-right, 0px)); bottom: calc(28% + 70px); width: 60px; height: 60px; font-size: 20px; }
  #fsBtn { display: none; position: fixed; z-index: 7; right: calc(10px + env(safe-area-inset-right, 0px)); top: 10px; width: 44px; height: 44px;
    border-radius: 10px; border: 2px solid rgba(255,255,255,.35); background: rgba(11,17,32,.6); color: var(--text); font: 700 20px var(--font-ui); touch-action: manipulation; }
  body.playing #fsBtn { top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  #touch #tPause { left: calc(14px + env(safe-area-inset-left, 0px)); top: 14px; width: 50px; height: 50px; font-size: 18px; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 6; background: rgba(5,7,13,.94); color: var(--gold);
    font: 700 20px var(--font-ui); align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #kbd { position: fixed; left: -200px; top: 0; width: 10px; height: 10px; opacity: 0; }
  @media (pointer: coarse) {
    body { padding: 0; }
    body.canfs #fsBtn { display: block; }
    #screen { width: min(100vw, calc(100vh * 16 / 9)); border: 0; border-radius: 0; }
    #hint { display: none; }
  }
  @media (pointer: coarse) and (orientation: portrait) { body.playing #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="screen" width="960" height="540"></canvas>
<div id="hint"></div>
<div id="touch">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <button id="tFire">FIRE</button><button id="tDodge">⤳</button><button id="tPause">II</button>
</div>
<div id="rotate">↻</div>
<button id="fsBtn" aria-label="Fullscreen">⛶</button>
<input id="kbd" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-hidden="true">
<script>
"use strict";
// =====================================================================================
// MARGIN CALL – PC-Version (Browser). Gleiche Spiellogik wie die Cardputer-Firmware v3.
// Live-Kurse kommen vom lokalen Spiel-Server (MarginCall.exe) unter /api/market.
// =====================================================================================

// Sprache: Englisch ist Standard, Deutsch per Optionsmenue. L(en, de) waehlt den passenden Text.
const L = (en, de) => { try { return settings.lang === "de" ? de : en; } catch (e) { return en; } };
const LOC = () => L("en-US", "de-DE");
const APP_VERSION = "3.19.5";
// Online-Rangliste (Cloudflare Worker, siehe worker/README.md). Leer = nicht eingerichtet, dann ist alles Online ausgeblendet.
const ONLINE_HS_URL = "https://margincall-highscores.margincall.workers.dev";
const RW = 320, VH = 150, TEX = 32, MAP = 20, NUM_LEVELS = 5;
const PLANE = 0.66, PROJ = RW / (2 * PLANE);
const DW = 960, DH = 540, SC = 3, HUD_Y = VH * SC;

const screen = document.getElementById("screen");
const g = screen.getContext("2d");
const low = document.createElement("canvas"); low.width = RW; low.height = VH;
const lg = low.getContext("2d");
const img = lg.createImageData(RW, VH);
const fb = new Uint32Array(img.data.buffer);

// ---------------------------------------------------------------- Zufall
let rngState = 0x1234567;
function rnd() { rngState ^= rngState << 13; rngState >>>= 0; rngState ^= rngState >>> 17; rngState ^= rngState << 5; rngState >>>= 0; return rngState; }
function frand() { return (rnd() & 0xFFFF) / 65535; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------------------------------------------------------------- Farben (ABGR fuer ImageData)
const RGB = (r, g, b) => ((255 << 24) | (clamp(b|0,0,255) << 16) | (clamp(g|0,0,255) << 8) | clamp(r|0,0,255)) >>> 0;
const css = (r, g, b) => `rgb(${r},${g},${b})`;

// ---------------------------------------------------------------- Markt
const markets = [
  { label: "DOW", name: "Dow Jones", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "S&P", name: "S&P 500", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "NDX", name: "Nasdaq-100", p: 0, prev: 0, chg: 0, s: [], live: false },
  { get label() { return L("OIL", "OEL"); }, get name() { return L("Crude Oil WTI", "Rohöl WTI"); }, p: 0, prev: 0, chg: 0, s: [], live: false },
];
const M_DOW = 0, M_SPX = 1, M_NDX = 2, M_OIL = 3;
// Einzelwerte je Index – nur fuer den Ticker, auf das Spiel wirken allein die Leitindizes
const STOCKS = [["GS", 0], ["CAT", 0], ["HD", 0], ["JPM", 0], ["BA", 0], ["KO", 0],
  ["AAPL", 1], ["AMZN", 1], ["GOOGL", 1], ["META", 1], ["LLY", 1], ["BRK-B", 1],
  ["NVDA", 2], ["MSFT", 2], ["AVGO", 2], ["TSLA", 2], ["NFLX", 2], ["AMD", 2], ["XOM", 3], ["CVX", 3]]
  .map(([sym, m]) => ({ sym, label: sym.replace("-", "."), m, p: 0, chg: 0, live: false }));
let marketStatus = "sim", marketTime = 0;
const mStat = () => marketStatus === "LIVE" ? "LIVE" : marketStatus === "nosrv" ? L("SIMULATED (no server)", "SIMULIERT (kein Server)") : L("SIMULATED", "SIMULIERT");

function marketsSimulate() {
  const base = [51000, 7700, 30000, 90];
  markets.forEach((m, i) => {
    if (m.live) return;
    let v = base[i] * (0.97 + 0.06 * Math.random());
    m.prev = v; m.s = [];
    const drift = (Math.random() * 2 - 1) * 0.0004;
    for (let k = 0; k < 78; k++) { v *= 1 + drift + (Math.random() * 2 - 1) * 0.0015; m.s.push(v); }
    m.p = v; m.chg = (m.p - m.prev) / m.prev * 100;
  });
  // simulierte Einzelwerte folgen grob ihrem Index (ohne Preis, nur Veraenderung)
  for (const s of STOCKS) if (!s.live) { s.p = 0; s.chg = markets[s.m].chg + (Math.random() * 2 - 1) * 1.5; }
}
async function marketsFetch() {
  if (settings.liveData !== true) {   // Datenschutz: ohne Zustimmung keine Anfrage an Yahoo Finance
    markets.forEach(m => m.live = false); STOCKS.forEach(s => s.live = false);
    marketStatus = "sim"; marketsSimulate(); buildTicker(); return;
  }
  try {
    const r = await fetch(WEB_BUILD ? ONLINE_HS_URL + "/market" : "/api/market", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    let live = 0;
    d.markets.forEach((x, i) => {
      if (!x || !x.s || x.s.length < 2) return;
      Object.assign(markets[i], { p: x.p, prev: x.prev, chg: (x.p - x.prev) / x.prev * 100, s: x.s, live: true });
      live++;
    });
    for (const s of STOCKS) {
      const x = d.stocks && d.stocks[s.sym];
      if (x && x.prev) Object.assign(s, { p: x.p, chg: (x.p - x.prev) / x.prev * 100, live: true });
    }
    if (live) { marketStatus = "LIVE"; marketTime = d.time * 1000; }
  } catch (e) { if (marketStatus !== "LIVE") marketStatus = "nosrv"; }
  marketsSimulate();
  if (state === ST.PLAY) applyMarket(false);
  buildTicker();
}

// ---------------------------------------------------------------- Texturen
const PCOLOR = [[40, 200, 90], [60, 140, 255], [255, 150, 40], [255, 80, 200]];   // Spielerfarben
const tmp = new Uint32Array(TEX * TEX);
function tclear(c) { tmp.fill(c); }
function tpx(x, y, c) { if (x >= 0 && y >= 0 && x < TEX && y < TEX) tmp[(y|0) * TEX + (x|0)] = c; }
function trect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) tpx(i, j, c); }
function tellipse(cx, cy, rx, ry, c) {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
    if (dx * dx + dy * dy <= 1) tpx(x, y, c);
  }
}
const tcirc = (cx, cy, r, c) => tellipse(cx, cy, r, r, c);
function ttri(x0, y0, x1, y1, x2, y2, c) {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const px = x + .5, py = y + .5;
    const d0 = (x1 - x0) * (py - y0) - (y1 - y0) * (px - x0);
    const d1 = (x2 - x1) * (py - y1) - (y2 - y1) * (px - x1);
    const d2 = (x0 - x2) * (py - y2) - (y0 - y2) * (px - x2);
    const neg = d0 < 0 || d1 < 0 || d2 < 0, pos = d0 > 0 || d1 > 0 || d2 > 0;
    if (!(neg && pos)) tpx(x, y, c);
  }
}
function tline(x0, y0, x1, y1, c, th = 1) {
  let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;) {
    trect(x0, y0, th, th, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
const T = { MARBLE: 0, TICKER: 1, SERVER: 2, GOLD: 3, VAULT: 4, CHART: 5, PIPES: 6, BARRELS: 7, AICORE: 8 };
const wallTex = [];   // [tex][shade] -> Uint32Array
function storeWall(idx) {
  const f = [1, .72, .48, .28];
  wallTex[idx] = f.map(k => {
    const out = new Uint32Array(TEX * TEX);
    for (let i = 0; i < out.length; i++) {
      const c = tmp[i];
      out[i] = RGB((c & 255) * k, ((c >> 8) & 255) * k, ((c >> 16) & 255) * k);
    }
    return out;
  });
}
const S = {}; ["BEAR0","BEAR1","SELL0","SELL1","BUB0","BUB1","SHARK0","SHARK1","BULL0","BULL1","BARON0","BARON1",
  "SLICK0","SLICK1","BOT0","BOT1","ALGO0","ALGO1","DEAD","PROJ","PROJ_OIL","LASER","CASH","DIV",
  "AVM0","AVM1","AVM2","AVM3","AVMBULL","AVMBEAR","AVF0","AVF1","AVF2","AVF3","AVFBULL","AVFBEAR",
  "PIR0","PIR1","PIR2","PIR3","PIR4","PIR5","NOTE","KEY"].forEach((n, i) => S[n] = i);
const sprTex = [];
function storeSprite(idx) { sprTex[idx] = tmp.slice(); }
// Keycard des Levels: jede Tresortuer braucht ihre eigene Farbe
const KEY_COL = [[255, 210, 40], [60, 140, 255], [235, 50, 50], [50, 205, 90], [175, 80, 235]];
const KEY_EN = ["YELLOW", "BLUE", "RED", "GREEN", "PURPLE"], KEY_DE = ["GELBE", "BLAUE", "ROTE", "GRÜNE", "VIOLETTE"];
const keyColName = () => L(KEY_EN[level] || KEY_EN[0], KEY_DE[level] || KEY_DE[0]);
function makeKeySprite(lv) {
  const [r, g, b] = KEY_COL[lv] || KEY_COL[0];
  tclear(0);
  trect(5, 14, 22, 16, RGB(r * .5, g * .5, b * .5)); trect(6, 15, 20, 14, RGB(r, g, b));
  trect(6, 18, 20, 3, RGB(240, 240, 245)); trect(9, 23, 6, 4, RGB(230, 185, 60)); trect(10, 24, 4, 2, RGB(170, 130, 30));
  trect(18, 24, 6, 1, RGB(r * .5, g * .5, b * .5)); trect(18, 26, 4, 1, RGB(r * .5, g * .5, b * .5));
  tline(16, 14, 16, 8, RGB(40, 40, 50), 1); tcirc(16, 7, 2, RGB(40, 40, 50)); tcirc(16, 7, 1, 0);
  storeSprite(S.KEY);
}

function seriesRange(m, manip = true) {
  let lo = Infinity, hi = -Infinity;
  for (const v of m.s) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (manip && manipDrawn && m.s.length) { const v = manipSeries(m, m.s.length - 1); lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (hi - lo < 1e-6) hi = lo + 1;
  return [lo, hi];
}
// Von ALGO-9000 verbogener Verlauf: ab 60 % des Tages schrittweise auf den manipulierten Kurs
function manipSeries(m, i) {
  const n = m.s.length, a = Math.floor(n * .6);
  return m.s[i] * (1 + (i > a ? manipDrawn / 100 * (i - a) / Math.max(1, n - 1 - a) : 0));
}
const MANIP_COL = () => RGB(255, 60, 200);
function genTickerTex(m) {
  tclear(RGB(8, 12, 22));
  const up = m.chg >= 0;
  for (let x = 0; x < TEX; x++) for (let y = 2; y < 9; y++)
    if ((x % 8) < 6 && (rnd() % 3)) tpx(x, y, (((x >> 3) % 3) === 2) !== up ? RGB(40, 230, 90) : RGB(240, 50, 50));
  const [lo, hi] = seriesRange(m), n = m.s.length;
  for (let x = 0; x < TEX; x++) {
    const i = n > 1 ? Math.floor(x * (n - 1) / (TEX - 1)) : 0;
    const y = 29 - Math.floor((m.s[i] - lo) / (hi - lo) * 15);
    for (let yy = y + 1; yy < 31; yy++) tpx(x, yy, up ? RGB(10, 70, 35) : RGB(80, 15, 15));
    tpx(x, y, up ? RGB(80, 255, 130) : RGB(255, 80, 80));
  }
  const py = 29 - Math.floor((m.prev - lo) / (hi - lo) * 15);
  if (py >= 13 && py <= 30) for (let x = 0; x < TEX; x += 3) tpx(x, py, RGB(200, 200, 90));
  if (manipDrawn) for (let x = Math.floor(TEX * .6); x < TEX; x++) {
    const i = n > 1 ? Math.floor(x * (n - 1) / (TEX - 1)) : 0;
    tpx(x, clamp(29 - Math.floor((manipSeries(m, i) - lo) / (hi - lo) * 15), 12, 30), MANIP_COL());
  }
  for (let i = 0; i < TEX; i++) { tpx(i, 0, RGB(90, 90, 100)); tpx(i, 11, RGB(40, 40, 60)); tpx(i, 31, RGB(90, 90, 100)); }
  storeWall(T.TICKER);
}
function genChartTex(m) {
  tclear(RGB(225, 228, 235));
  for (let y = 4; y < 30; y += 6) trect(1, y, 30, 1, RGB(200, 205, 215));
  const [lo, hi] = seriesRange(m), n = m.s.length;
  const Y = v => 27 - Math.floor((v - lo) / (hi - lo) * 22);
  for (let k = 0; k < 7; k++) {
    const a = Math.floor(k * n / 7), b = Math.max(a + 1, Math.floor((k + 1) * n / 7));
    const o = m.s[a], c = m.s[b - 1]; let h = o, l = o;
    for (let i = a; i < b; i++) { h = Math.max(h, m.s[i]); l = Math.min(l, m.s[i]); }
    const x = 2 + k * 4;
    trect(x + 1, Y(h), 1, Y(l) - Y(h) + 1, RGB(60, 60, 60));
    let t = Y(Math.max(o, c)), bt = Y(Math.min(o, c)); if (bt - t < 1) bt = t + 1;
    trect(x, t, 3, bt - t, c >= o ? RGB(20, 170, 60) : RGB(220, 40, 40));
  }
  if (manipDrawn) for (let x = 17; x < 31; x++) {   // manipulierter Verlauf, doppelt so dick
    const i = Math.min(n - 1, Math.floor((x - 1) * n / 30)), y = clamp(Y(manipSeries(m, i)), 1, 29);
    tpx(x, y, MANIP_COL()); tpx(x, y + 1, MANIP_COL());
  }
  for (let i = 0; i < TEX; i++) { tpx(i, 0, RGB(50, 50, 60)); tpx(i, 31, RGB(50, 50, 60)); tpx(0, i, RGB(50, 50, 60)); tpx(31, i, RGB(50, 50, 60)); }
  storeWall(T.CHART);
}

function genWalls() {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const n = Math.floor(frand() * 24) - 12;
    const v = Math.sin(x * .22 + y * .13 + 2.5 * Math.sin(y * .27 + x * .05));
    const base = 196 + n;
    let c = RGB(base, base - 8, base - 26);
    if (Math.abs(v) < .10) c = RGB(120 + n, 115 + n, 110 + n);
    if (y % 16 === 0 || ((x + (y >> 4) * 16) % 32) === 0) c = RGB(140, 130, 112);
    tmp[y * TEX + x] = c;
  }
  storeWall(T.MARBLE);

  tclear(RGB(42, 44, 50));
  for (let y = 0; y < TEX; y += 4) trect(1, y, 30, 1, RGB(20, 20, 24));
  const led = [RGB(40, 255, 80), RGB(60, 140, 255), RGB(255, 180, 30)];
  for (let y = 1; y < TEX; y += 4) {
    for (let x = 3; x < 20; x += 2) tpx(x, y + 1, RGB(28, 28, 32));
    for (let x = 23; x < 30; x += 2) if (rnd() % 2) tpx(x, y + 1, led[rnd() % 3]);
  }
  trect(0, 0, 1, 32, RGB(80, 80, 90)); trect(31, 0, 1, 32, RGB(15, 15, 18));
  storeWall(T.SERVER);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const row = y >> 3, ly = y % 8, lx = (x + (row % 2) * 8) % 16;
    let c;
    if (ly === 7 || lx === 15) c = RGB(80, 50, 10);
    else { const b = 255 - ly * 14 - Math.floor(frand() * 10); c = RGB(b, b * 3 / 4, 30); if (ly === 0) c = RGB(255, 240, 150); }
    tmp[y * TEX + x] = c;
  }
  storeWall(T.GOLD);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const n = rnd() % 12; tmp[y * TEX + x] = RGB(110 + n, 115 + n, 122 + n); }
  tcirc(16, 17, 13, RGB(70, 74, 80)); tcirc(16, 17, 11, RGB(150, 155, 162)); tcirc(16, 17, 4, RGB(60, 62, 68));
  tline(16, 17, 16, 8, RGB(220, 200, 80), 2); tline(16, 17, 8, 22, RGB(220, 200, 80), 2); tline(16, 17, 24, 22, RGB(220, 200, 80), 2);
  for (let a = 0; a < 8; a++) tpx(16 + Math.trunc(12 * Math.cos(a * .785)), 17 + Math.trunc(12 * Math.sin(a * .785)), RGB(40, 40, 40));
  trect(13, 1, 6, 2, RGB(40, 255, 90));
  storeWall(T.VAULT);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const n = rnd() % 14; tmp[y * TEX + x] = RGB(62 + n, 48 + n / 2, 36); }
  for (let p = 0; p < 2; p++) {
    const y0 = p ? 18 : 4;
    for (let y = 0; y < 9; y++) {
      const s = Math.sin((y + .5) / 9 * Math.PI), gg = 50 + Math.floor(130 * s);
      trect(0, y0 + y, 32, 1, p ? RGB(gg, gg * 2 / 3, gg / 3) : RGB(gg * 3 / 4, gg * 3 / 4, gg * 4 / 5));
    }
    for (const fx of [7, 23]) { trect(fx, y0 - 1, 3, 11, RGB(40, 40, 44)); tpx(fx + 1, y0 + 1, RGB(200, 200, 200)); tpx(fx + 1, y0 + 7, RGB(200, 200, 200)); }
  }
  for (let i = 0; i < 6; i++) { const x = rnd() % 32; trect(x, 13 + rnd() % 3, 1, 2 + rnd() % 4, RGB(10, 10, 12)); }
  storeWall(T.PIPES);

  tclear(RGB(20, 18, 16));
  for (let bx = 0; bx < 2; bx++) for (let by = 0; by < 2; by++) {
    const x0 = bx * 16 + 1, y0 = by * 16 + 1;
    for (let x = 0; x < 14; x++) {
      const s = Math.sin((x + .5) / 14 * Math.PI);
      trect(x0 + x, y0, 1, 14, (bx + by) % 2 ? RGB(30 + 60 * s, 40 + 70 * s, 110 + 90 * s) : RGB(120 + 110 * s, 25 + 30 * s, 20 + 20 * s));
    }
    trect(x0, y0 + 3, 14, 1, RGB(15, 15, 15)); trect(x0, y0 + 10, 14, 1, RGB(15, 15, 15));
    tcirc(x0 + 7, y0 + 6.5, 2, RGB(250, 210, 40)); tpx(x0 + 7, y0 + 6, RGB(10, 10, 10));
  }
  storeWall(T.BARRELS);

  tclear(RGB(4, 8, 14));
  for (let x = 1; x < TEX; x += 2) {
    const start = rnd() % 32, len = 6 + rnd() % 14;

  }
  tcirc(16, 16, 7, RGB(40, 40, 48)); tcirc(16, 16, 5.5, RGB(120, 0, 0)); tcirc(16, 16, 3.5, RGB(255, 30, 20)); tcirc(16, 16, 1.5, RGB(255, 230, 120));
  storeWall(T.AICORE);
}

    const arm = k == 1 ? RGB(235, 235, 235) : k == 2 ? skin : shirt;

  const AV_COLORS = [[PCOLOR[0], 0], [PCOLOR[1], 0], [PCOLOR[2], 0], [PCOLOR[3], 0], [[40, 200, 90], 1], [[220, 50, 50], 2]];
  for (const female of [false, true])

        trect(8, 12, 16, 10, main); trect(8, 20, 16, 2, dark); tellipse(16, 12, 6, 2.2, dark);   // Hoodie
        trect(5, 13, 3, 9, main); trect(24, 13, 3, 5, main); tcirc(6.5, 22.5, 1.6, skin);
        trect(15, 14, 2, 6, white); trect(13, 15, 6, 1, white); trect(13, 18, 6, 1, white); tpx(13, 16, white); tpx(18, 17, white);   // "$"
        tline(12, 12, 16, 15, gold); tline(16, 15, 20, 12, gold);   // Goldkette
        tcirc(16, 7, 5, skin);
        trect(11, 1, 10, 4, dark); trect(8, 3, 4, 2, dark);   // Basecap (Schirm zur Seite)
        tpx(14, 7, black); tpx(18, 7, black);
        trect(12, 9, 8, 3, RGB(85, 55, 35)); trect(15, 10, 2, 1, RGB(160, 80, 70));   // Bart + Mund
        trect(10, 4, 2, 5, black); tline(11, 8, 14, 11, black); tpx(14, 11, RGB(255, 60, 60));   // Headset
        trect(24, 16, 7, 3, gun); trect(27, 14, 3, 2, gold); tcirc(25, 18.5, 1.4, skin);   // Blaster
      } else {
        const skin = RGB(240, 198, 168), hair = RGB(170, 62, 28);
        tellipse(23, 12, 3, 7, hair); tellipse(24, 18, 2, 3, hair);   // Pferdeschwanz
        trect(11, 28, 4, 4, black); trect(17, 28, 4, 4, black);   // Stiefel
        trect(12, 23, 2, 5, skin); trect(18, 23, 2, 5, skin);
        ttri(16, 13, 6, 25, 26, 25, main); trect(10, 13, 12, 7, main); trect(7, 23, 18, 2, dark);   // Kleid
        trect(10, 18, 12, 1, gold);   // Guertel
        ttri(13, 13, 19, 13, 16, 17, RGB(255, 235, 240));
        trect(6, 14, 3, 8, skin); trect(23, 14, 3, 4, skin);
        tellipse(16, 6.5, 6.5, 5.5, hair);
        tcirc(16, 8, 4.4, skin);
        trect(11, 3, 10, 2, hair); tpx(11, 5, hair); tpx(20, 5, hair);
        trect(12, 2, 8, 1, black);   // Sonnenbrille im Haar
        tpx(14, 8, black); tpx(18, 8, black); tpx(13, 7, black); tpx(19, 7, black);
        trect(15, 10, 2, 1, RGB(210, 40, 70));   // Lippen
        tcirc(11.3, 10, 1.1, gold); tcirc(20.7, 10, 1.1, gold);   // Creolen
        trect(24, 15, 7, 3, gun); trect(27, 13, 3, 2, gold);   // Blaster
      }
      if (deco === 1) { ttri(11, 3, 5, -2, 9, 5, gold); ttri(21, 3, 27, -2, 23, 5, gold); }
      if (deco === 2) { tcirc(10, 2.5, 2.5, RGB(110, 70, 38)); tcirc(22, 2.5, 2.5, RGB(110, 70, 38)); tcirc(10, 2.5, 1.2, RGB(200, 130, 120)); tcirc(22, 2.5, 1.2, RGB(200, 130, 120)); }
      storeSprite((female ? S.AVF0 : S.AVM0) + k);
    });
}

  for (let i = 0; i < 64; i++) {
    let d;
    if (sdx < sdy) { d = sdx; sdx += ddx; mx += stepX; } else { d = sdy; sdy += ddy; my += stepY; }
    if (solidCell(mx, my)) return d;
  }

}

// Ein Raum beim MARGIN-CALL-Server leitet die Nachrichten weiter wie der eingebaute Server im LAN; der Host rechnet das Spiel.
// Erst nach ausdruecklicher Zustimmung (settings.onlineMP) wird verbunden.
const ONLINE_WS = ONLINE_HS_URL.replace(/^http/, "ws");
const CODE_CHARS = "ABCDEFGJLMNQRSTUVWXYZ23456789";   // ohne H, K, P (Tastenkuerzel), O/0 und I/1
let onlineRooms = [], onlineSel = 0, codeText = "", roomsT = 0, onlineBack = ST.TITLE;
function openOnline() {
  onlineBack = state === ST.MPMENU ? ST.MPMENU : ST.TITLE;
  if (settings.onlineMP !== true) { state = ST.ONLINEASK; return; }
  state = ST.ONLINE; onlineSel = 0; codeText = ""; roomsT = 0; onlineRooms = [];
}
function hostOnline(pub) {
  netConnect(ONLINE_WS + "/room/new?pub=" + (pub ? 1 : 0) + "&v=" + APP_VERSION); net.pub = pub;
  state = ST.LOBBY; lobbyInfo = [];
}
function joinOnline(code) {
  if (!code) return;
  netConnect(ONLINE_WS + "/room/" + code + "?v=" + APP_VERSION);
  state = ST.LOBBY; lobbyInfo = [];
}
function onlineAskKey(k) {
  if (k === "enter") { settings.onlineMP = true; saveSettings(); state = onlineBack; openOnline(); }
  else if (k === "Escape" || k === "n") state = onlineBack;
}
let codeAsk = false;   // Dialog "Privatem Spiel beitreten" offen
function copyCode() {
  try { navigator.clipboard.writeText(net.code).then(() => { lobbyNote = L("CODE COPIED", "CODE KOPIERT"); lobbyNoteT = 2; sfx("HIT"); }).catch(() => { }); } catch (e) { }
}
function onlineKey(k) {
  if (codeAsk) {
    if (k === "Escape") { codeAsk = false; codeText = ""; return; }
    if (k === "Backspace") { codeText = codeText.slice(0, -1); return; }
    if (k === "enter") { if (codeText.length === 5) { codeAsk = false; joinOnline(codeText); } return; }
    const c = k.length === 1 ? k.toUpperCase() : "";
    if (c && CODE_CHARS.includes(c) && codeText.length < 5) codeText += c;
    return;
  }
  if (k === "Escape") { state = onlineBack; return; }
  if (k.startsWith("room:")) { const r = onlineRooms[+k.slice(5)]; if (r) joinOnline(r.code); return; }
  if (k === "ArrowUp") { onlineSel = Math.max(0, onlineSel - 1); return; }
  if (k === "ArrowDown") { onlineSel = Math.min(Math.max(0, Math.min(6, onlineRooms.length) - 1), onlineSel + 1); return; }
  if (k === "enter") { if (onlineRooms[onlineSel]) joinOnline(onlineRooms[onlineSel].code); return; }
  if (k === "h") hostOnline(true);
  else if (k === "p") hostOnline(false);
  else if (k === "j") { codeAsk = true; codeText = ""; }
  else if (k === "k") editNick();
}

  g.fillStyle = "rgba(0,0,0,.88)"; g.fillRect(140, 40, DW - 280, 460);
  text(L("JOIN GAME", "SPIEL BEITRETEN"), DW / 2, 56, "#ffd232", 36, "center");
  text(L("GAMES FOUND ON THE NETWORK", "GEFUNDENE SPIELE IM NETZWERK"), 170, 108, "#6b7896", 13);
  if (!foundGames.length) {
    const dots = ".".repeat(1 + Math.floor(gameTime * 2) % 3);
    text(`${L("Searching for open games", "Suche nach offenen Spielen")}${dots}`, DW / 2, 160, "#a0a0b4", 17, "center");
    text(L("The host must be in their lobby. If nothing shows up, enter the address below.", "Der Host muss in seiner Lobby sein. Wird nichts gefunden, gib unten die Adresse ein."), DW / 2, 190, "#6b7896", 13, "center");
  }
  foundGames.slice(0, 5).forEach((gm, i) => {
    const y = 128 + i * 44, sel = i === joinSel && !joinText;
    const label = `${gm.name}${gm.host ? "  ·  " + gm.host : ""}  ·  ${gm.mode}  ·  ${gm.players}/4`;
    zoneButton(170, y, DW - 340, 38, (sel ? "▶ " : "") + label, sel ? "#50ff82" : "#c8c8d7", "game:" + i, 16);
    text(gm.addr, DW - 180, y + 12, "#6b7896", 12, "right");
  });
  text(L("OR ENTER AN ADDRESS", "ODER ADRESSE EINGEBEN"), 170, 356, "#6b7896", 13);
  g.strokeStyle = joinText ? "#50ff82" : "#2a3656"; g.lineWidth = 2; g.strokeRect(170, 374, DW - 340, 40);
  text((joinText || (Math.floor(gameTime * 3) % 2 ? "" : "z. B. 192.168.1.20:8080")) + (joinText && Math.floor(gameTime * 3) % 2 ? "▌" : ""), 182, 384, joinText ? "#ffffff" : "#4a5672", 20);
  zoneButton(250, 434, 220, 40, L("[ENTER] CONNECT", "[ENTER] VERBINDEN"), "#50ff82", "enter");
  zoneButton(490, 434, 220, 40, L("[ESC] BACK", "[ESC] ZURÜCK"), "#8290b0", "Escape");
}
function joinTo(addr) {
  const host = addr.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  if (!host) return;
  location.href = appUrl(`http://${host.includes(":") ? host : host + ":8080"}`, "&join=1");
}
function joinKey(k) {
  if (k === "Escape") { state = ST.MPMENU; return; }
  if (k.startsWith("game:")) { const gm = foundGames[+k.slice(5)]; if (gm) joinTo(gm.addr); return; }
  if (k === "ArrowUp") { joinSel = Math.max(0, joinSel - 1); return; }
  if (k === "ArrowDown") { joinSel = Math.min(Math.max(0, Math.min(5, foundGames.length) - 1), joinSel + 1); return; }
  if (k === "Backspace") { joinText = joinText.slice(0, -1); return; }
  if (k === "enter") {
    if (joinText.trim()) joinTo(joinText);
    else if (foundGames[joinSel]) joinTo(foundGames[joinSel].addr);
    return;
  }
  if (k.length === 1 && /[0-9a-z.:\-]/.test(k) && joinText.length < 40) joinText += k;
}
function renderQuitAsk() {
  g.fillStyle = "rgba(0,0,0,.75)"; g.fillRect(0, 0, DW, DH);
  g.fillStyle = "#000"; g.fillRect(250, 180, 460, 150); g.strokeStyle = "#ff7050"; g.lineWidth = 2; g.strokeRect(250, 180, 460, 150);
  text(L("QUIT THE GAME?", "SPIEL WIRKLICH BEENDEN?"), DW / 2, 202, "#ffd232", 26, "center");
  zoneButton(272, 260, 200, 44, L("[ENTER] QUIT", "[ENTER] BEENDEN"), "#ff7050", "enter", 17);
  zoneButton(488, 260, 200, 44, L("[ESC] CANCEL", "[ESC] ABBRECHEN"), "#50ff82", "Escape", 17);
}
function renderMpMenu() {
  g.fillStyle = "rgba(0,0,0,.88)"; g.fillRect(250, 150, 460, 160);
  text(L("MULTIPLAYER MENU", "MULTIPLAYER-MENÜ"), DW / 2, 166, "#ffd232", 26, "center");
  text(L("The game keeps running!", "Das Spiel läuft weiter!"), DW / 2, 202, "#ff7050", 16, "center");
  zoneButton(268, 226, 205, 34, L("[L] LEAVE", "[L] VERLASSEN"), "#ffffff", "l", 16);
  zoneButton(487, 226, 205, 34, L("[Q] MAIN MENU", "[Q] HAUPTMENÜ"), "#ff7050", "q", 16);
  zoneButton(368, 268, 224, 30, L("[ESC] BACK TO GAME", "[ESC] ZURÜCK INS SPIEL"), "#8290b0", "Escape", 15);
}

// ---------------------------------------------------------------- Statistik-Einblendung (Tab gedrueckt halten)
function renderScoreOverlay() {
  const mp = isMP(), rows = mp ? [...players].sort((a, b) => b.score - a.score) : [me];
  const h = mp ? 92 + rows.length * 34 : 200, y0 = Math.max(40, (HUD_Y - h) / 2);
  g.fillStyle = "rgba(4,8,18,.9)"; g.fillRect(150, y0, DW - 300, h);
  g.strokeStyle = "#28c86e"; g.lineWidth = 2; g.strokeRect(150, y0, DW - 300, h);
  if (!mp) {
    text(L("YOUR RUN", "DEIN LAUF"), DW / 2, y0 + 14, "#ffd232", 26, "center");
    [["P&L", `+$${me.score.toLocaleString(LOC())}`, "#50ff82"], ["LEVEL", `${level + 1} / ${NUM_LEVELS}`, "#e6e6f0"],
     ["KILLS", String(me.kills), "#e6e6f0"], [L("DEATHS", "TODE"), String(me.deaths || 0), me.deaths ? "#ff7050" : "#e6e6f0"],
     [L("MARKET CLEANUP", "MARKTBEREINIGUNG"), String(marketKills), "#a0a0b4"]].forEach(([k, v, c], i) => {
      text(k, 260, y0 + 56 + i * 26, "#8290b0", 16); text(v, DW - 260, y0 + 56 + i * 26, c, 18, "right");
    });
    return;
  }
  const pvp = mode === "dm" || mode === "team";
  text(mode === "team" ? L(`TEAM BULL ${teamScore[0]}  :  ${teamScore[1]} TEAM BEAR`, `TEAM BULLE ${teamScore[0]}  :  ${teamScore[1]} TEAM BÄR`) : mode === "dm" ? "DEATHMATCH" : L("CO-OP", "KOOP"), DW / 2, y0 + 12, "#ffd232", 22, "center");
  const cols = pvp ? [["P&L", 560], ["FRAGS", 650], [L("DEATHS", "TODE"), 730], ["KILLS", 800]] : [["P&L", 600], ["KILLS", 700], [L("DEATHS", "TODE"), 790]];
  text(L("PLAYER", "SPIELER"), 180, y0 + 50, "#6b7896", 13);
  cols.forEach(([c, x]) => text(c, x, y0 + 50, "#6b7896", 13, "right"));
  rows.forEach((p, i) => {
    const y = y0 + 72 + i * 34;
    if (p.local) { g.fillStyle = "rgba(255,210,50,.1)"; g.fillRect(160, y - 5, DW - 320, 30); }
    g.fillStyle = rgbCss(playerColor(p)); g.fillRect(180, y, 16, 16);
    text(`${i + 1}. ${nameOf(p)}${p.local ? L(" (YOU)", " (DU)") : ""}${p.dead ? " ☠" : ""}`, 206, y, "#e6e6f0", 17);
    const vals = pvp ? [`+$${p.score}`, p.frags || 0, p.deaths || 0, p.kills] : [`+$${p.score}`, p.kills, p.deaths || 0];
    vals.forEach((v, j) => text(String(v), cols[j][1], y, j === 0 ? "#50ff82" : "#e6e6f0", 17, "right"));
  });
}

// ---------------------------------------------------------------- Hauptschleife
let last = performance.now(), lobbyT = 0;
function renderPlay(dt) {
  if (island) renderIsland(); else { marketVisuals(); renderWalls(); renderSprites(); renderGlitch(); renderFlicker(); }
  renderPsy();
  const hk = hurtT > 0 ? Math.min(1, hurtT / .35) * Math.min(1, .45 + hurtAmt / 40) : 0;
  if (hk > 0) for (let i = 0; i < fb.length; i++) {   // roter Bildblitz
    const c = fb[i], r = c & 255, gg = (c >> 8) & 255, b = (c >> 16) & 255, k = hk * .65;
    fb[i] = RGB(r + (255 - r) * k, gg * (1 - k), b * (1 - k));
  }
  lg.putImageData(img, 0, 0); if (!me.dead) renderWeapon();
  const shx = hk > 0 ? (Math.random() - .5) * 16 * hk : 0, shy = hk > 0 ? (Math.random() - .5) * 10 * hk : 0;
  if (shx || shy) { g.fillStyle = "#300"; g.fillRect(0, 0, DW, HUD_Y); }
  g.drawImage(low, 0, 0, RW, VH, shx, shy, DW, HUD_Y);
  renderHUD();
  if (down("scores") && !chatTyping) renderScoreOverlay();
}
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  g.imageSmoothingEnabled = false;
  netMsgT -= dt;
  clickZones = [];   // Klickflaechen werden beim Zeichnen jedes Bildes neu registriert
  if (COARSE) {
    const playing = state === ST.PLAY && !mpMenu && !chatTyping && !(me && me.dead);
    if (document.body.classList.toggle("playing", playing) !== playing) { }
    if (!playing) { touchMv.x = touchMv.y = 0; touchFire = false; }
    document.getElementById("tFire").textContent = L("FIRE", "FEUER");
    document.getElementById("rotate").textContent = L("↻  Turn your phone sideways", "↻  Dreh dein Handy quer");
  }
  musicSchedule();   // sofort reagieren, wenn Pause an/aus geht
  if (serverGone) {   // Spiel einfrieren, bis der Server wieder da ist
    g.fillStyle = "rgba(0,0,0,.85)"; g.fillRect(0, 170, DW, 170);
    text(IN_APP ? L("THE HOST ENDED THE GAME", "DER HOST HAT DAS SPIEL BEENDET") : L("GAME SERVER STOPPED", "SPIEL-SERVER BEENDET"), DW / 2, 190, "#ff5050", 36, "center");
    text(L("The connection is gone. Music and game are paused.", "Die Verbindung ist weg. Musik und Spiel sind angehalten."), DW / 2, 248, "#dcdce6", 18, "center");
    clickZones = [];
    if (IN_APP) { zoneButton(230, 278, 280, 40, L("[H] BACK TO MY GAME", "[H] ZURÜCK ZU MEINEM SPIEL"), "#50ff82", "h", 16); zoneButton(530, 278, 200, 40, L("[ESC] QUIT", "[ESC] BEENDEN"), "#ff7050", "Escape", 16); }
    else text(L("Restart MARGIN CALL or close this tab.", "Starte MARGIN CALL neu oder schließe diesen Tab."), DW / 2, 282, "#ffffff", 18, "center");
    last = now; requestAnimationFrame(frame); return;
  }
  // Host: Lobby-Status regelmaessig verteilen, Snapshots auch auf Endbildschirmen
  if (isHost() && net.connected) {
    if (state === ST.LOBBY && (lobbyT -= dt) <= 0) { lobbyT = net.online ? 1 : .3; hostSendLobby(); }
  }
  lobbyNoteT -= dt;
  // Spiel im LAN ankuendigen, solange der Host in der Lobby ist (nur in der App bzw. am eigenen Server)
  const shouldAdvertise = isLocalOrigin() && net.connected && !net.online && isHost() && state === ST.LOBBY;
  if (state === ST.ONLINE && (roomsT -= dt) <= 0) {   // oeffentliche Online-Spiele abfragen
    roomsT = 3;
    fetch(ONLINE_HS_URL + "/rooms?v=" + APP_VERSION, { cache: "no-store" }).then(r => r.json()).then(l => { onlineRooms = Array.isArray(l) ? l : []; }).catch(() => { onlineRooms = []; });
  }
  if (shouldAdvertise && (advertiseT -= dt) <= 0) {
    advertiseT = 1; advertising = true;
    fetch("/api/host", { method: "POST", body: JSON.stringify({ active: true, name: myGameName(), host: me.name, mode: modeName(lobbyMode), players: players.length }) }).catch(() => { });
  } else if (!shouldAdvertise && advertising) {
    advertising = false; fetch("/api/host", { method: "POST", body: JSON.stringify({ active: false }) }).catch(() => { });
  }
  // Offene Spiele suchen, solange "Spiel beitreten" offen ist
  if (state === ST.JOIN && (gamesT -= dt) <= 0) {
    gamesT = 1;
    fetch("/api/games", { cache: "no-store" }).then(r => r.json()).then(l => { foundGames = Array.isArray(l) ? l : []; }).catch(() => { });
  }
  if (isHost() && net.connected && isMP() && state !== ST.PLAY && state !== ST.LOBBY && performance.now() - lastSent > (net.online ? 500 : 200)) { lastSent = performance.now(); hostSendSnapshot(); }
  switch (state) {
    case ST.TITLE: gameTime += dt; renderTitle(); if (quitAsk) renderQuitAsk(); break;
    case ST.PRIVACY: gameTime += dt; renderPrivacy(); break;
    case ST.NAMEENTRY: gameTime += dt; renderNameEntry(); break;
    case ST.HIGHSCORES: gameTime += dt; renderHighscores(); break;
    case ST.LOBBY: gameTime += dt; renderLobby(); break;
    case ST.PLAY: updateGame(dt); if (state === ST.PLAY) { renderPlay(dt); if (mpMenu) renderMpMenu(); } break;
    case ST.MPMENU: gameTime += dt; renderMpChoice(); break;
    case ST.JOIN: gameTime += dt; renderJoin(); break;
    case ST.ONLINE: gameTime += dt; renderOnline(); break;
    case ST.ONLINEASK: gameTime += dt; renderOnlineAsk(); break;
    case ST.PAUSE:
      g.fillStyle = "#000"; g.fillRect(230, 160, 500, 130);
      text(L("TRADING HALTED", "HANDEL AUSGESETZT"), DW / 2, 178, "#ffd232", 28, "center");
      zoneButton(250, 228, 145, 40, L("[ESC] RESUME", "[ESC] WEITER"), "#50ff82", "Escape", 16);
      zoneButton(408, 228, 145, 40, L("[O] OPTIONS", "[O] OPTIONEN"), "#50c8ff", "o", 16);
      zoneButton(566, 228, 145, 40, L("[Q] MAIN MENU", "[Q] HAUPTMENÜ"), "#ff7050", "q", 16);
      break;
    case ST.OPTIONS: optMsgT -= dt; renderOptions(); if (isClient() && optReturn === ST.PLAY) updateGame(0); break;
    case ST.LEVELDONE: gameTime += dt; renderEnd("CLOSING BELL!", L("Level cleared – the price is rising", "Level geschafft – der Kurs steigt"), "#50ff82", true); break;
    case ST.ROUNDEND:
      gameTime += dt;
      if (isHost()) { roundT -= dt; if (roundT <= 0) { nextRound(); break; } }   // automatisch weiter nach der Pause
      renderRoundEnd(); break;
    case ST.DEAD: gameTime += dt;
      if (HC()) renderEnd("GAME OVER", L("Hardcore: bankruptcy is final – your run is over", "Hardcore: Die Insolvenz ist endgültig – dein Lauf ist vorbei"), "#ff3c3c", false);
      else renderEnd(L("BANKRUPT", "INSOLVENZ"), L(`Bankruptcy no. ${me.deaths} – penalty −$${deathPenalty.toLocaleString(LOC())} (25 % of P&L)`, `Insolvenz Nr. ${me.deaths} – Strafe −$${deathPenalty.toLocaleString(LOC())} (25 % des P&L)`), "#ff3c3c", false);
      break;
    case ST.CREDITS: gameTime += dt; creditsT += dt; renderCredits(); if (creditsT > CREDITS_LEN) startIsland(); break;
    case ST.OUTRO: gameTime += dt; outroT += dt; renderOutro(dt); if (outroT > OUTRO_LEN) state = ST.WIN; break;
    case ST.WIN: gameTime += dt;
      if (islandDone) { renderEnd(L("TAX HAVEN", "STEUEROASE"), `${isleResult}  ·  Gold ${isleCoins}/${ISLE_COINS}${isleAll ? ` · Bonus +$${ISLE_ALL_BONUS.toLocaleString(LOC())}` : ""}`, "#ffd232", true); break; }
      renderEnd(L("BULL MARKET!", "BULLENMARKT!"), me.winBonus ? L(`ALGO-9000 defeated – bull market bonus +$${me.winBonus.toLocaleString(LOC())}${me.deaths ? "" : " incl. clean sheet"}`, `ALGO-9000 besiegt – Bullenmarkt-Bonus +$${me.winBonus.toLocaleString(LOC())}${me.deaths ? "" : " inkl. weißer Weste"}`) : L("ALGO-9000 defeated – the market is free", "ALGO-9000 besiegt – der Markt ist frei"), "#ffd232", true);
      break;
  }
  if (edit) { clickZones = []; renderEdit(); }
  requestAnimationFrame(frame);
}

players = [me = makePlayer(0, true)];
if (settings.music === false && settings.musicVol === 7 && settings.musicLast === undefined) settings.musicVol = 0;   // alte Ein/Aus-Einstellung uebernehmen
delete settings.music;
musicOn = settings.musicVol > 0;   // gespeicherte Musik-Lautstaerke
updateHint();
marketsSimulate();
genWalls(); genSprites();
applyMarket();
buildWorld(0);
musicStart();
if (settings.liveData === undefined && !URLP.has("join")) state = ST.PRIVACY;
marketsFetch();
setInterval(marketsFetch, 60000);
if (!WEB_BUILD) fetch("/api/info", { cache: "no-store" }).then(r => r.json()).then(i => { myAddr = `${i.ip}:${i.port}`; }).catch(() => { });
if (URLP.has("join")) enterLobby();
if (IN_APP && settings.fullscreen) setFullscreen(true);
requestAnimationFrame(frame);
</script>
