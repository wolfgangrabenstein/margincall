<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MARGIN CALL</title>
<style>
  :root {
    /* Layout: ein einziger Spielschirm, zentriert auf dunklem Handelssaal-Hintergrund */
    --bg: #05070d;
    --panel: #0b1120;
    --line: #1e7a46;
    --text: #d8e0f0;
    --muted: #6b7896;
    --gold: #ffd23a;
    --font-ui: "Consolas", "Lucida Console", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-inline: 16px; box-sizing: border-box; overflow: hidden;
  }
  #screen {
    width: min(100%, calc((100vh - 60px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9;
    image-rendering: pixelated; background: #000; border: 2px solid var(--line); border-radius: 6px;
    cursor: crosshair;
  }
  #hint { color: var(--muted); font-size: 12px; margin-top: 8px; text-align: center; }
  #touch { display: none; position: fixed; inset: auto 0 0 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; pointer-events: none; }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 54px); gap: 6px; pointer-events: auto; }
  #touch button { width: 54px; height: 54px; border-radius: 10px; border: 1px solid var(--line); background: rgba(11,17,32,.75);
    color: var(--text); font: 700 15px var(--font-ui); touch-action: none; }
  #touch .fire { width: 84px; height: 84px; border-radius: 50%; background: rgba(120,20,20,.8); color: var(--gold); pointer-events: auto; align-self: end; }
  @media (pointer: coarse) { #touch { display: flex; } #hint { display: none; } }
</style>
</head>
<body>
<canvas id="screen" width="960" height="540"></canvas>
<div id="hint"></div>
<div id="touch">
  <div class="pad">
    <button data-k="a">A</button><button data-k="w">▲</button><button data-k="d">D</button>
    <button data-k="ArrowLeft">⟲</button><button data-k="s">▼</button><button data-k="ArrowRight">⟳</button>
  </div>
  <button class="fire" data-k=" ">FEUER</button>
</div>
<script>
"use strict";
// =====================================================================================
// MARGIN CALL – PC-Version (Browser). Gleiche Spiellogik wie die Cardputer-Firmware v3.
// Live-Kurse kommen vom lokalen Spiel-Server (MarginCall.exe) unter /api/market.
// =====================================================================================

const APP_VERSION = "3.12.0";
// Online-Rangliste (Cloudflare Worker, siehe worker/README.md). Leer = nicht eingerichtet, dann ist alles Online ausgeblendet.
const ONLINE_HS_URL = "https://margincall-highscores.margincall.workers.dev";
const RW = 320, VH = 150, TEX = 32, MAP = 20, NUM_LEVELS = 5;
const PLANE = 0.66, PROJ = RW / (2 * PLANE);
const DW = 960, DH = 540, SC = 3, HUD_Y = VH * SC;

const screen = document.getElementById("screen");
const g = screen.getContext("2d");
const low = document.createElement("canvas"); low.width = RW; low.height = VH;
const lg = low.getContext("2d");
const img = lg.createImageData(RW, VH);
const fb = new Uint32Array(img.data.buffer);

// ---------------------------------------------------------------- Zufall
let rngState = 0x1234567;
function rnd() { rngState ^= rngState << 13; rngState >>>= 0; rngState ^= rngState >>> 17; rngState ^= rngState << 5; rngState >>>= 0; return rngState; }
function frand() { return (rnd() & 0xFFFF) / 65535; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------------------------------------------------------------- Farben (ABGR fuer ImageData)
const RGB = (r, g, b) => ((255 << 24) | (clamp(b|0,0,255) << 16) | (clamp(g|0,0,255) << 8) | clamp(r|0,0,255)) >>> 0;
const css = (r, g, b) => `rgb(${r},${g},${b})`;

// ---------------------------------------------------------------- Markt
const markets = [
  { label: "DOW", name: "Dow Jones", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "S&P", name: "S&P 500", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "NDX", name: "Nasdaq-100", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "OEL", name: "Rohöl WTI", p: 0, prev: 0, chg: 0, s: [], live: false },
];
const M_DOW = 0, M_SPX = 1, M_NDX = 2, M_OIL = 3;
// Einzelwerte je Index – nur fuer den Ticker, auf das Spiel wirken allein die Leitindizes
const STOCKS = [["GS", 0], ["CAT", 0], ["HD", 0], ["JPM", 0], ["BA", 0], ["KO", 0],
  ["AAPL", 1], ["AMZN", 1], ["GOOGL", 1], ["META", 1], ["LLY", 1], ["BRK-B", 1],
  ["NVDA", 2], ["MSFT", 2], ["AVGO", 2], ["TSLA", 2], ["NFLX", 2], ["AMD", 2], ["XOM", 3], ["CVX", 3]]
  .map(([sym, m]) => ({ sym, label: sym.replace("-", "."), m, p: 0, chg: 0, live: false }));
let marketStatus = "SIMULIERT", marketTime = 0;

function marketsSimulate() {
  const base = [51000, 7700, 30000, 90];
  markets.forEach((m, i) => {
    if (m.live) return;
    let v = base[i] * (0.97 + 0.06 * Math.random());
    m.prev = v; m.s = [];
    const drift = (Math.random() * 2 - 1) * 0.0004;
    for (let k = 0; k < 78; k++) { v *= 1 + drift + (Math.random() * 2 - 1) * 0.0015; m.s.push(v); }
    m.p = v; m.chg = (m.p - m.prev) / m.prev * 100;
  });
  // simulierte Einzelwerte folgen grob ihrem Index (ohne Preis, nur Veraenderung)
  for (const s of STOCKS) if (!s.live) { s.p = 0; s.chg = markets[s.m].chg + (Math.random() * 2 - 1) * 1.5; }
}
async function marketsFetch() {
  if (settings.liveData !== true) {   // Datenschutz: ohne Zustimmung keine Anfrage an Yahoo Finance
    markets.forEach(m => m.live = false); STOCKS.forEach(s => s.live = false);
    marketStatus = "SIMULIERT"; marketsSimulate(); buildTicker(); return;
  }
  try {
    const r = await fetch("/api/market", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    let live = 0;
    d.markets.forEach((x, i) => {
      if (!x || !x.s || x.s.length < 2) return;
      Object.assign(markets[i], { p: x.p, prev: x.prev, chg: (x.p - x.prev) / x.prev * 100, s: x.s, live: true });
      live++;
    });
    for (const s of STOCKS) {
      const x = d.stocks && d.stocks[s.sym];
      if (x && x.prev) Object.assign(s, { p: x.p, chg: (x.p - x.prev) / x.prev * 100, live: true });
    }
    if (live) { marketStatus = "LIVE"; marketTime = d.time * 1000; }
  } catch (e) { if (marketStatus !== "LIVE") marketStatus = "SIMULIERT (kein Server)"; }
  marketsSimulate();
  if (state === ST.PLAY) applyMarket(false);
  buildTicker();
}

// ---------------------------------------------------------------- Texturen
const PCOLOR = [[40, 200, 90], [60, 140, 255], [255, 150, 40], [255, 80, 200]];   // Spielerfarben
const tmp = new Uint32Array(TEX * TEX);
function tclear(c) { tmp.fill(c); }
function tpx(x, y, c) { if (x >= 0 && y >= 0 && x < TEX && y < TEX) tmp[(y|0) * TEX + (x|0)] = c; }
function trect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) tpx(i, j, c); }
function tellipse(cx, cy, rx, ry, c) {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
    if (dx * dx + dy * dy <= 1) tpx(x, y, c);
  }
}
const tcirc = (cx, cy, r, c) => tellipse(cx, cy, r, r, c);
function ttri(x0, y0, x1, y1, x2, y2, c) {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const px = x + .5, py = y + .5;
    const d0 = (x1 - x0) * (py - y0) - (y1 - y0) * (px - x0);
    const d1 = (x2 - x1) * (py - y1) - (y2 - y1) * (px - x1);
    const d2 = (x0 - x2) * (py - y2) - (y0 - y2) * (px - x2);
    const neg = d0 < 0 || d1 < 0 || d2 < 0, pos = d0 > 0 || d1 > 0 || d2 > 0;
    if (!(neg && pos)) tpx(x, y, c);
  }
}
function tline(x0, y0, x1, y1, c, th = 1) {
  let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;) {
    trect(x0, y0, th, th, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
const T = { MARBLE: 0, TICKER: 1, SERVER: 2, GOLD: 3, VAULT: 4, CHART: 5, PIPES: 6, BARRELS: 7, AICORE: 8 };
const wallTex = [];   // [tex][shade] -> Uint32Array
function storeWall(idx) {
  const f = [1, .72, .48, .28];
  wallTex[idx] = f.map(k => {
    const out = new Uint32Array(TEX * TEX);
    for (let i = 0; i < out.length; i++) {
      const c = tmp[i];
      out[i] = RGB((c & 255) * k, ((c >> 8) & 255) * k, ((c >> 16) & 255) * k);
    }
    return out;
  });
}
const S = {}; ["BEAR0","BEAR1","SELL0","SELL1","BUB0","BUB1","SHARK0","SHARK1","BULL0","BULL1","BARON0","BARON1",
  "SLICK0","SLICK1","BOT0","BOT1","ALGO0","ALGO1","DEAD","PROJ","PROJ_OIL","LASER","CASH","DIV",
  "AVM0","AVM1","AVM2","AVM3","AVMBULL","AVMBEAR","AVF0","AVF1","AVF2","AVF3","AVFBULL","AVFBEAR"].forEach((n, i) => S[n] = i);
const sprTex = [];
function storeSprite(idx) { sprTex[idx] = tmp.slice(); }

function seriesRange(m, manip = true) {
  let lo = Infinity, hi = -Infinity;
  for (const v of m.s) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (manip && manipDrawn && m.s.length) { const v = manipSeries(m, m.s.length - 1); lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (hi - lo < 1e-6) hi = lo + 1;
  return [lo, hi];
}
// Von ALGO-9000 verbogener Verlauf: ab 60 % des Tages schrittweise auf den manipulierten Kurs
function manipSeries(m, i) {
  const n = m.s.length, a = Math.floor(n * .6);
  return m.s[i] * (1 + (i > a ? manipDrawn / 100 * (i - a) / Math.max(1, n - 1 - a) : 0));
}
const MANIP_COL = () => RGB(255, 60, 200);
function genTickerTex(m) {
  tclear(RGB(8, 12, 22));
  const up = m.chg >= 0;
  for (let x = 0; x < TEX; x++) for (let y = 2; y < 9; y++)
    if ((x % 8) < 6 && (rnd() % 3)) tpx(x, y, (((x >> 3) % 3) === 2) !== up ? RGB(40, 230, 90) : RGB(240, 50, 50));
  const [lo, hi] = seriesRange(m), n = m.s.length;
  for (let x = 0; x < TEX; x++) {
    const i = n > 1 ? Math.floor(x * (n - 1) / (TEX - 1)) : 0;
    const y = 29 - Math.floor((m.s[i] - lo) / (hi - lo) * 15);
    for (let yy = y + 1; yy < 31; yy++) tpx(x, yy, up ? RGB(10, 70, 35) : RGB(80, 15, 15));
    tpx(x, y, up ? RGB(80, 255, 130) : RGB(255, 80, 80));
  }
  const py = 29 - Math.floor((m.prev - lo) / (hi - lo) * 15);
  if (py >= 13 && py <= 30) for (let x = 0; x < TEX; x += 3) tpx(x, py, RGB(200, 200, 90));
  if (manipDrawn) for (let x = Math.floor(TEX * .6); x < TEX; x++) {
    const i = n > 1 ? Math.floor(x * (n - 1) / (TEX - 1)) : 0;
    tpx(x, clamp(29 - Math.floor((manipSeries(m, i) - lo) / (hi - lo) * 15), 12, 30), MANIP_COL());
  }
  for (let i = 0; i < TEX; i++) { tpx(i, 0, RGB(90, 90, 100)); tpx(i, 11, RGB(40, 40, 60)); tpx(i, 31, RGB(90, 90, 100)); }
  storeWall(T.TICKER);
}
function genChartTex(m) {
  tclear(RGB(225, 228, 235));
  for (let y = 4; y < 30; y += 6) trect(1, y, 30, 1, RGB(200, 205, 215));
  const [lo, hi] = seriesRange(m), n = m.s.length;
  const Y = v => 27 - Math.floor((v - lo) / (hi - lo) * 22);
  for (let k = 0; k < 7; k++) {
    const a = Math.floor(k * n / 7), b = Math.max(a + 1, Math.floor((k + 1) * n / 7));
    const o = m.s[a], c = m.s[b - 1]; let h = o, l = o;
    for (let i = a; i < b; i++) { h = Math.max(h, m.s[i]); l = Math.min(l, m.s[i]); }
    const x = 2 + k * 4;
    trect(x + 1, Y(h), 1, Y(l) - Y(h) + 1, RGB(60, 60, 60));
    let t = Y(Math.max(o, c)), bt = Y(Math.min(o, c)); if (bt - t < 1) bt = t + 1;
    trect(x, t, 3, bt - t, c >= o ? RGB(20, 170, 60) : RGB(220, 40, 40));
  }
  if (manipDrawn) for (let x = 17; x < 31; x++) {   // manipulierter Verlauf, doppelt so dick
    const i = Math.min(n - 1, Math.floor((x - 1) * n / 30)), y = clamp(Y(manipSeries(m, i)), 1, 29);
    tpx(x, y, MANIP_COL()); tpx(x, y + 1, MANIP_COL());
  }
  for (let i = 0; i < TEX; i++) { tpx(i, 0, RGB(50, 50, 60)); tpx(i, 31, RGB(50, 50, 60)); tpx(0, i, RGB(50, 50, 60)); tpx(31, i, RGB(50, 50, 60)); }
  storeWall(T.CHART);
}

function genWalls() {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const n = Math.floor(frand() * 24) - 12;
    const v = Math.sin(x * .22 + y * .13 + 2.5 * Math.sin(y * .27 + x * .05));
    const base = 196 + n;
    let c = RGB(base, base - 8, base - 26);
    if (Math.abs(v) < .10) c = RGB(120 + n, 115 + n, 110 + n);
    if (y % 16 === 0 || ((x + (y >> 4) * 16) % 32) === 0) c = RGB(140, 130, 112);
    tmp[y * TEX + x] = c;
  }
  storeWall(T.MARBLE);

  tclear(RGB(42, 44, 50));
  for (let y = 0; y < TEX; y += 4) trect(1, y, 30, 1, RGB(20, 20, 24));
  const led = [RGB(40, 255, 80), RGB(60, 140, 255), RGB(255, 180, 30)];
  for (let y = 1; y < TEX; y += 4) {
    for (let x = 3; x < 20; x += 2) tpx(x, y + 1, RGB(28, 28, 32));
    for (let x = 23; x < 30; x += 2) if (rnd() % 2) tpx(x, y + 1, led[rnd() % 3]);
  }
  trect(0, 0, 1, 32, RGB(80, 80, 90)); trect(31, 0, 1, 32, RGB(15, 15, 18));
  storeWall(T.SERVER);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const row = y >> 3, ly = y % 8, lx = (x + (row % 2) * 8) % 16;
    let c;
    if (ly === 7 || lx === 15) c = RGB(80, 50, 10);
    else { const b = 255 - ly * 14 - Math.floor(frand() * 10); c = RGB(b, b * 3 / 4, 30); if (ly === 0) c = RGB(255, 240, 150); }
    tmp[y * TEX + x] = c;
  }
  storeWall(T.GOLD);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const n = rnd() % 12; tmp[y * TEX + x] = RGB(110 + n, 115 + n, 122 + n); }
  tcirc(16, 17, 13, RGB(70, 74, 80)); tcirc(16, 17, 11, RGB(150, 155, 162)); tcirc(16, 17, 4, RGB(60, 62, 68));
  tline(16, 17, 16, 8, RGB(220, 200, 80), 2); tline(16, 17, 8, 22, RGB(220, 200, 80), 2); tline(16, 17, 24, 22, RGB(220, 200, 80), 2);
  for (let a = 0; a < 8; a++) tpx(16 + Math.trunc(12 * Math.cos(a * .785)), 17 + Math.trunc(12 * Math.sin(a * .785)), RGB(40, 40, 40));
  trect(13, 1, 6, 2, RGB(40, 255, 90));
  storeWall(T.VAULT);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const n = rnd() % 14; tmp[y * TEX + x] = RGB(62 + n, 48 + n / 2, 36); }
  for (let p = 0; p < 2; p++) {
    const y0 = p ? 18 : 4;
    for (let y = 0; y < 9; y++) {
      const s = Math.sin((y + .5) / 9 * Math.PI), gg = 50 + Math.floor(130 * s);
      trect(0, y0 + y, 32, 1, p ? RGB(gg, gg * 2 / 3, gg / 3) : RGB(gg * 3 / 4, gg * 3 / 4, gg * 4 / 5));
    }
    for (const fx of [7, 23]) { trect(fx, y0 - 1, 3, 11, RGB(40, 40, 44)); tpx(fx + 1, y0 + 1, RGB(200, 200, 200)); tpx(fx + 1, y0 + 7, RGB(200, 200, 200)); }
  }
  for (let i = 0; i < 6; i++) { const x = rnd() % 32; trect(x, 13 + rnd() % 3, 1, 2 + rnd() % 4, RGB(10, 10, 12)); }
  storeWall(T.PIPES);

  tclear(RGB(20, 18, 16));
  for (let bx = 0; bx < 2; bx++) for (let by = 0; by < 2; by++) {
    const x0 = bx * 16 + 1, y0 = by * 16 + 1;
    for (let x = 0; x < 14; x++) {
      const s = Math.sin((x + .5) / 14 * Math.PI);
      trect(x0 + x, y0, 1, 14, (bx + by) % 2 ? RGB(30 + 60 * s, 40 + 70 * s, 110 + 90 * s) : RGB(120 + 110 * s, 25 + 30 * s, 20 + 20 * s));
    }
    trect(x0, y0 + 3, 14, 1, RGB(15, 15, 15)); trect(x0, y0 + 10, 14, 1, RGB(15, 15, 15));
    tcirc(x0 + 7, y0 + 6.5, 2, RGB(250, 210, 40)); tpx(x0 + 7, y0 + 6, RGB(10, 10, 10));
  }
  storeWall(T.BARRELS);

  tclear(RGB(4, 8, 14));
  for (let x = 1; x < TEX; x += 2) {
    const start = rnd() % 32, len = 6 + rnd() % 14;
    for (let i = 0; i < len; i++) if (rnd() % 3) tpx(x, (start + i) % 32, i === len - 1 ? RGB(200, 255, 220) : RGB(20, 120 + i * 6, 70 + i * 4));
  }
  tcirc(16, 16, 7, RGB(40, 40, 48)); tcirc(16, 16, 5.5, RGB(120, 0, 0)); tcirc(16, 16, 3.5, RGB(255, 30, 20)); tcirc(16, 16, 1.5, RGB(255, 230, 120));
  storeWall(T.AICORE);
}

function genSprites() {
  const N = 0;
  for (let f = 0; f < 2; f++) {   // Baer
    tclear(N);
    const fur = RGB(110, 70, 38), dark = RGB(70, 42, 20);
    tellipse(16, 21, 10, 9, fur);
    tcirc(10, 4, 3, fur); tcirc(22, 4, 3, fur); tcirc(10, 4, 1.5, RGB(200, 120, 120)); tcirc(22, 4, 1.5, RGB(200, 120, 120));
    tcirc(16, 10, 7, fur); tellipse(16, 13, 3.5, 2.5, RGB(175, 125, 85));
    trect(15, 11, 3, 2, RGB(0, 0, 0)); trect(12, 8, 2, 2, RGB(255, 30, 30)); trect(19, 8, 2, 2, RGB(255, 30, 30));
    trect(11, 7, 4, 1, dark); trect(18, 7, 4, 1, dark);
    trect(15, 17, 3, 5, RGB(230, 30, 30)); ttri(12, 22, 21, 22, 16.5, 27, RGB(230, 30, 30));
    trect(9, 28, 5, 4, dark); trect(18, 28, 5, 4, dark);
    if (!f) { trect(4, 17, 4, 9, fur); trect(24, 17, 4, 9, fur); }
    else { trect(3, 9, 4, 10, fur); trect(25, 9, 4, 10, fur); for (let i = 0; i < 3; i++) { tpx(3 + i, 8, RGB(240, 240, 240)); tpx(26 + i, 8, RGB(240, 240, 240)); } }
    storeSprite(S.BEAR0 + f);
  }
  for (let f = 0; f < 2; f++) {   // Bulle
    tclear(N);
    const hide = RGB(55, 38, 26), dark = RGB(30, 20, 14), gold = RGB(245, 200, 60), hy = f ? 3 : 0;
    tellipse(16, 21, 12, 8, hide);
    trect(6, 26, 4, 6, dark); trect(12, 27, 3, 5, dark); trect(18, 27, 3, 5, dark); trect(23, 26, 4, 6, dark);
    ttri(10, 8 + hy, 2, 1 + hy, 7, 11 + hy, gold); ttri(22, 8 + hy, 30, 1 + hy, 25, 11 + hy, gold);
    tcirc(16, 10 + hy, 6.5, hide); tellipse(16, 15 + hy, 4.5, 3, RGB(190, 130, 110));
    tpx(14, 15 + hy, RGB(0, 0, 0)); tpx(18, 15 + hy, RGB(0, 0, 0));
    tcirc(16, 18 + hy, 1.8, gold); tcirc(16, 18 + hy, .9, RGB(190, 130, 110));
    trect(12, 8 + hy, 2, 2, RGB(255, 255, 255)); trect(19, 8 + hy, 2, 2, RGB(255, 255, 255));
    tpx(13, 9 + hy, RGB(200, 0, 0)); tpx(19, 9 + hy, RGB(200, 0, 0));
    trect(15, 21, 3, 5, RGB(30, 210, 70)); ttri(12, 21, 21, 21, 16.5, 16.5, RGB(30, 210, 70));
    if (f) { tcirc(9, 17 + hy, 2, RGB(230, 230, 230)); tcirc(23, 17 + hy, 2, RGB(230, 230, 230)); tcirc(6, 18 + hy, 1.5, RGB(200, 200, 200)); }
    storeSprite(S.BULL0 + f);
  }
  for (let f = 0; f < 2; f++) {   // Short Seller
    tclear(N);
    const suit = RGB(30, 32, 55), skin = RGB(230, 188, 150);

const DODGE_WINDOW = .25, DODGE_TIME = .25, DODGE_SPEED = 7, DODGE_COOLDOWN = .6;

      let [f, s] = DODGE_DIRS[a];
      if (invertT > 0) s = -s;
      dodgeX = dirX * f - dirY * s; dodgeY = dirY * f + dirX * s;
      dodgeT = DODGE_TIME; dodgeCd = DODGE_TIME + DODGE_COOLDOWN;

function updateGame(dt) {
  gameTime += dt; musicPanic = me.hp < 30;
  fireCd -= dt; flashT -= dt; hurtT -= dt; pickT -= dt; msgT -= dt; dodgeCd -= dt;
  aiFaceT -= dt; crashT -= dt; glitchT -= dt; invertT -= dt;
  if (fakeT > 0) { fakeT -= dt; if (fakeT <= 0 || (Math.floor(gameTime * 4) % 2)) buildTicker(); }

    marketEffect();

    if (down("fwd")) fwd += 1;
    if (down("back")) fwd -= 1;
    if (down("turnL")) turn -= 1;
    if (down("turnR")) turn += 1;
    if (down("strafeL")) side -= 1;
    if (down("strafeR")) side += 1;
    let ang = turn * rot + mouseTurn * .0006 * settings.sens;
    if (invertT > 0) { ang = -ang; side = -side; }
    if (down("fire")) shoot();
    if (ang) {
      const c = Math.cos(ang), s = Math.sin(ang);
      [dirX, dirY] = [dirX * c - dirY * s, dirX * s + dirY * c];
      [planeX, planeY] = [planeX * c - planeY * s, planeX * s + planeY * c];
    }
    if (fwd || side) {
      let mx = dirX * fwd - dirY * side, my = dirY * fwd + dirX * side;
      const l = Math.hypot(mx, my); mx = mx / l * mv; my = my / l * mv;

      tryMove(dodgeX * v, dodgeY * v); bobT += dt * 20;

  }
  checkExit();
  if (state !== ST.PLAY) return;

  for (const it of items) {
    if (!it.active) continue;
    for (const pl of players) {
      if (pl.dead || (pl.x - it.x) ** 2 + (pl.y - it.y) ** 2 > .3) continue;
      if (it.type === 0) { if (pl.ammo >= 99) continue; const n = HC() ? 7 : 10; pl.ammo = Math.min(99, pl.ammo + n); sayTo(pl, `CASHFLOW +${n}`, 1.2); }
      else { if (pl.hp >= 100) continue; const n = HC() ? 15 : 20; pl.hp = Math.min(100, pl.hp + n); sayTo(pl, `DIVIDENDE AUSGESCHÜTTET +${n} %`, 1.2); }
      it.active = false; addScore(pl, 25);
      if (pl.local) pickT = .25; else emit(["pick", pl.id]);
      sfxTo(pl, it.type === 0 ? "KACHING" : "COINS");
      break;
    }
  }
  items = items.filter(i => i.active);

  replayT -= dt;
  const m = levelMarket();
  if (replayT <= 0 && m.s.length > 3) {
    replayT = 3; replayIdx = (replayIdx + 1) % m.s.length;
    const i0 = Math.max(0, replayIdx - 3);
    momentum = (m.s[replayIdx] - m.s[i0]) / m.s[i0] * 100;
  }
  bullsAlive = bearsAlive = 0;
  for (const e of enemies) {
    if (e.gone) continue;
    if (!e.alive) { e.deadT += dt; if (e.deadT > 7) e.gone = true; continue; }
    if (e.f === F.BULL) bullsAlive++; else if (e.f === F.BEAR) bearsAlive++;
    updateEnemy(e, dt);

  }

  if (spawnT <= 0) {
    const extraPl = mode === "coop" ? players.length - 1 : 0;   // Koop: mehr und schnellerer Nachschub
    spawnT = (7 + frand() * 5) / (1 + .5 * extraPl);
    if (bullsAlive + bearsAlive < 9 + (mode === "coop" ? 4 * extraPl : 2 * (players.length - 1))) {
      const c = findHiddenCell(5);
      if (c) spawnEnemy(frand() < clamp(pBullBase + momentum * 1.5, .1, .9) ? E.BULL : E.BEAR, c[0], c[1]);
    }
  }
  // vereinzeltes Bargeld abseits der Spieler, damit niemand ganz ohne Munition dasteht;
  // wer fast leer ist, findet schneller etwas, mehr als 2 solcher Scheine liegen nie herum
  cashT -= dt;
  if (cashT <= 0) {
    const broke = players.some(p => !p.dead && p.ammo <= 3);
    cashT = (broke ? 15 + frand() * 10 : 45 + frand() * 30) * (HC() ? 1.6 : 1);
    if (items.filter(i => i.active && i.stray).length < 2) {

  }

  for (const p of projs) {
    if (!p.active) continue;
    p.x += p.dx * dt; p.y += p.dy * dt;
    if (solidCell(Math.floor(p.x), Math.floor(p.y))) { p.active = false; continue; }
    for (const pl of players) {
      if (pl.dead || (pl.x - p.x) ** 2 + (pl.y - p.y) ** 2 >= .12) continue;
      if (mode === "team" && (p.f === F.BULL || p.f === F.BEAR) && p.f === teamFaction(pl)) continue;
      p.active = false;
      damagePlayer(pl, p.dmg, p.spr === S.LASER ? "ALGO-ORDER AUSGEFÜHRT!" : p.spr === S.PROJ_OIL ? "ÖLFASS! ENERGIEKRISE" : "MARGIN CALL!");
      if (p.spr === S.PROJ_OIL) pl.slowT = 2;
      break;
    }
    if (!p.active) continue;
    if (p.f === F.BULL || p.f === F.BEAR) for (const e of enemies) {
      if (!e.alive || !hostile(p.f, e.f)) continue;
      if ((e.x - p.x) ** 2 + (e.y - p.y) ** 2 < .15) { hurtEnemy(e, 2, null); p.active = false; break; }
    }

    }
  }
  if (isMP() && performance.now() - lastSent > 50) { lastSent = performance.now(); hostSendSnapshot(); }
}

  zoneButton(490, 452, 220, 38, hsHC ? "[X] ZU NORMAL" : "[X] ZU ☠ HARDCORE", hsHC ? "#ffd232" : "#ff5050", "x", 16);
}

// ---------------------------------------------------------------- Texteingabe (Nickname, Spielname)
let edit = null;   // { title, value, max, done(value) }
const cleanName = (v, max) => String(v || "").replace(/[^\p{L}\p{N} ._\-!?&]/gu, "").replace(/\s+/g, " ").trim().slice(0, max);
const defaultNick = () => me && me.id ? `TRADER ${PNAMES[(me.id - 1) % 4]}` : "TRADER";
const myNick = () => settings.nickname || defaultNick();
const myGameName = () => settings.gameName || `Spiel von ${myNick()}`;
function openEdit(title, value, max, done) { edit = { title, value, max, done }; }
function editKey(k) {
  if (k === "enter") { const v = cleanName(edit.value, edit.max); const d = edit.done; edit = null; d(v); return; }
  if (k === "Escape") { edit = null; return; }
  if (k === "Backspace") { edit.value = edit.value.slice(0, -1); return; }
  if (rawKey.length === 1 && /[\p{L}\p{N} ._\-!?&]/u.test(rawKey) && edit.value.length < edit.max) edit.value += rawKey;
}
function renderEdit() {
  g.fillStyle = "rgba(0,0,0,.7)"; g.fillRect(0, 0, DW, DH);
  g.fillStyle = "#0b1120"; g.fillRect(230, 170, 500, 200);
  g.strokeStyle = "#ffd232"; g.lineWidth = 2; g.strokeRect(230, 170, 500, 200);
  text(edit.title, DW / 2, 188, "#ffd232", 22, "center");
  g.strokeStyle = "#50c8ff"; g.strokeRect(260, 228, 440, 44);
  text(edit.value + (Math.floor(gameTime * 3) % 2 ? "▌" : ""), DW / 2, 238, "#ffffff", 24, "center");
  text(`bis ${edit.max} Zeichen · leer lassen = Standard`, DW / 2, 280, "#6b7896", 13, "center");
  zoneButton(260, 310, 210, 40, "[ENTER] SPEICHERN", "#50ff82", "enter", 16);
  zoneButton(490, 310, 210, 40, "[ESC] ABBRECHEN", "#8290b0", "Escape", 16);
}
function editNick() {
  openEdit("DEIN NICKNAME", settings.nickname || "", 12, v => {
    settings.nickname = v; saveSettings();
    if (me && net.connected) {
      me.name = myNick();
      if (isHost()) hostSendLobby(); else netSend({ t: "nick", name: me.name });
    }
  });
}
function editGameName() { openEdit("SPIELNAME", settings.gameName || "", 24, v => { settings.gameName = v; saveSettings(); if (isHost() && net.connected) hostSendLobby(); }); }

// ---------------------------------------------------------------- Hosten / Beitreten / MP-Menue
function renderMpChoice() {
  chartBackground("#123a26", "#3a1414");
  g.fillStyle = "rgba(0,0,0,.88)"; g.fillRect(160, 50, DW - 320, 440);
  text("MULTIPLAYER", DW / 2, 64, "#ffd232", 40, "center");
  text("DEIN NICKNAME", 300, 120, "#6b7896", 13);
  zoneButton(300, 136, 360, 32, `${myNick()}   ✎ [K]`, "#ffd232", "k", 18);
  text("SPIELNAME (WENN DU HOSTEST)", 300, 178, "#6b7896", 13);
  zoneButton(300, 194, 360, 32, `${myGameName()}   ✎ [G]`, "#c8c8d7", "g", 18);
  zoneButton(300, 252, 360, 44, "[H] SPIEL HOSTEN", "#50c8ff", "h", 24);
  text(`Mitspieler finden dein Spiel unter „Beitreten“ (Adresse: ${myAddr || "…"})`, DW / 2, 304, "#a0a0b4", 14, "center");
  zoneButton(300, 336, 360, 44, "[J] SPIEL BEITRETEN", "#50ff82", "j", 24);
  text("Offene Spiele im Netzwerk werden automatisch gesucht", DW / 2, 388, "#a0a0b4", 14, "center");
  zoneButton(390, 432, 180, 34, "[ESC] ZURÜCK", "#8290b0", "Escape", 16);
}
function renderJoin() {
  chartBackground("#123a26", "#3a1414");
  g.fillStyle = "rgba(0,0,0,.88)"; g.fillRect(140, 40, DW - 280, 460);
  text("SPIEL BEITRETEN", DW / 2, 56, "#ffd232", 36, "center");
  text("GEFUNDENE SPIELE IM NETZWERK", 170, 108, "#6b7896", 13);
  if (!foundGames.length) {
    const dots = ".".repeat(1 + Math.floor(gameTime * 2) % 3);
    text(`Suche nach offenen Spielen${dots}`, DW / 2, 160, "#a0a0b4", 17, "center");
    text("Der Host muss in seiner Lobby sein. Wird nichts gefunden, gib unten die Adresse ein.", DW / 2, 190, "#6b7896", 13, "center");
  }
  foundGames.slice(0, 5).forEach((gm, i) => {
    const y = 128 + i * 44, sel = i === joinSel && !joinText;
    const label = `${gm.name}${gm.host ? "  ·  " + gm.host : ""}  ·  ${gm.mode}  ·  ${gm.players}/4`;
    zoneButton(170, y, DW - 340, 38, (sel ? "▶ " : "") + label, sel ? "#50ff82" : "#c8c8d7", "game:" + i, 16);
    text(gm.addr, DW - 180, y + 12, "#6b7896", 12, "right");
  });
  text("ODER ADRESSE EINGEBEN", 170, 356, "#6b7896", 13);
  g.strokeStyle = joinText ? "#50ff82" : "#2a3656"; g.lineWidth = 2; g.strokeRect(170, 374, DW - 340, 40);
  text((joinText || (Math.floor(gameTime * 3) % 2 ? "" : "z. B. 192.168.1.20:8080")) + (joinText && Math.floor(gameTime * 3) % 2 ? "▌" : ""), 182, 384, joinText ? "#ffffff" : "#4a5672", 20);
  zoneButton(250, 434, 220, 40, "[ENTER] VERBINDEN", "#50ff82", "enter");
  zoneButton(490, 434, 220, 40, "[ESC] ZURÜCK", "#8290b0", "Escape");
}
function joinTo(addr) {
  const host = addr.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  if (!host) return;
  location.href = appUrl(`http://${host.includes(":") ? host : host + ":8080"}`, "&join=1");
}
function joinKey(k) {
  if (k === "Escape") { state = ST.MPMENU; return; }
  if (k.startsWith("game:")) { const gm = foundGames[+k.slice(5)]; if (gm) joinTo(gm.addr); return; }
  if (k === "ArrowUp") { joinSel = Math.max(0, joinSel - 1); return; }
  if (k === "ArrowDown") { joinSel = Math.min(Math.max(0, Math.min(5, foundGames.length) - 1), joinSel + 1); return; }
  if (k === "Backspace") { joinText = joinText.slice(0, -1); return; }
  if (k === "enter") {
    if (joinText.trim()) joinTo(joinText);
    else if (foundGames[joinSel]) joinTo(foundGames[joinSel].addr);
    return;
  }
  if (k.length === 1 && /[0-9a-z.:\-]/.test(k) && joinText.length < 40) joinText += k;
}
function renderMpMenu() {
  g.fillStyle = "rgba(0,0,0,.88)"; g.fillRect(250, 150, 460, 160);
  text("MULTIPLAYER-MENÜ", DW / 2, 166, "#ffd232", 26, "center");
  text("Das Spiel läuft weiter!", DW / 2, 202, "#ff7050", 16, "center");
  zoneButton(268, 226, 205, 34, "[L] VERLASSEN", "#ffffff", "l", 16);
  zoneButton(487, 226, 205, 34, "[ESC] HAUPTMENÜ", "#ff7050", "Escape", 16);
  zoneButton(368, 268, 224, 30, "[P] ZURÜCK INS SPIEL", "#8290b0", "p", 15);
}

// ---------------------------------------------------------------- Statistik-Einblendung (Tab gedrueckt halten)
function renderScoreOverlay() {
  const mp = isMP(), rows = mp ? [...players].sort((a, b) => b.score - a.score) : [me];
  const h = mp ? 92 + rows.length * 34 : 200, y0 = Math.max(40, (HUD_Y - h) / 2);
  g.fillStyle = "rgba(4,8,18,.9)"; g.fillRect(150, y0, DW - 300, h);
  g.strokeStyle = "#28c86e"; g.lineWidth = 2; g.strokeRect(150, y0, DW - 300, h);
  if (!mp) {
    text("DEIN LAUF", DW / 2, y0 + 14, "#ffd232", 26, "center");
    [["P&L", `+$${me.score.toLocaleString("de-DE")}`, "#50ff82"], ["LEVEL", `${level + 1} / ${NUM_LEVELS}`, "#e6e6f0"],
     ["KILLS", String(me.kills), "#e6e6f0"], ["TODE", String(me.deaths || 0), me.deaths ? "#ff7050" : "#e6e6f0"],
     ["MARKTBEREINIGUNG", String(marketKills), "#a0a0b4"]].forEach(([k, v, c], i) => {
      text(k, 260, y0 + 56 + i * 26, "#8290b0", 16); text(v, DW - 260, y0 + 56 + i * 26, c, 18, "right");
    });
    return;
  }
  const pvp = mode === "dm" || mode === "team";
  text(mode === "team" ? `TEAM BULLE ${teamScore[0]}  :  ${teamScore[1]} TEAM BÄR` : mode === "dm" ? "DEATHMATCH" : "KOOP", DW / 2, y0 + 12, "#ffd232", 22, "center");
  const cols = pvp ? [["P&L", 560], ["FRAGS", 650], ["TODE", 730], ["KILLS", 800]] : [["P&L", 600], ["KILLS", 700], ["TODE", 790]];
  text("SPIELER", 180, y0 + 50, "#6b7896", 13);
  cols.forEach(([c, x]) => text(c, x, y0 + 50, "#6b7896", 13, "right"));
  rows.forEach((p, i) => {
    const y = y0 + 72 + i * 34;
    if (p.local) { g.fillStyle = "rgba(255,210,50,.1)"; g.fillRect(160, y - 5, DW - 320, 30); }
    g.fillStyle = rgbCss(playerColor(p)); g.fillRect(180, y, 16, 16);
    text(`${i + 1}. ${nameOf(p)}${p.local ? " (DU)" : ""}${p.dead ? " ☠" : ""}`, 206, y, "#e6e6f0", 17);
    const vals = pvp ? [`+$${p.score}`, p.frags || 0, p.deaths || 0, p.kills] : [`+$${p.score}`, p.kills, p.deaths || 0];
    vals.forEach((v, j) => text(String(v), cols[j][1], y, j === 0 ? "#50ff82" : "#e6e6f0", 17, "right"));
  });
}

// ---------------------------------------------------------------- Hauptschleife
let last = performance.now(), lobbyT = 0;
function renderPlay(dt) {
  marketVisuals(); renderWalls(); renderSprites(); renderGlitch(); renderFlicker();
  lg.putImageData(img, 0, 0); if (!me.dead) renderWeapon();
  g.drawImage(low, 0, 0, RW, VH, 0, 0, DW, HUD_Y);
  renderHUD();
  if (down("scores") && !chatTyping) renderScoreOverlay();
}
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  g.imageSmoothingEnabled = false;
  netMsgT -= dt;
  clickZones = [];   // Klickflaechen werden beim Zeichnen jedes Bildes neu registriert
  musicSchedule();   // sofort reagieren, wenn Pause an/aus geht
  if (serverGone) {   // Spiel einfrieren, bis der Server wieder da ist
    g.fillStyle = "rgba(0,0,0,.85)"; g.fillRect(0, 170, DW, 170);
    text(IN_APP ? "DER HOST HAT DAS SPIEL BEENDET" : "SPIEL-SERVER BEENDET", DW / 2, 190, "#ff5050", 36, "center");
    text("Die Verbindung ist weg. Musik und Spiel sind angehalten.", DW / 2, 248, "#dcdce6", 18, "center");
    clickZones = [];
    if (IN_APP) { zoneButton(230, 278, 280, 40, "[H] ZURÜCK ZU MEINEM SPIEL", "#50ff82", "h", 16); zoneButton(530, 278, 200, 40, "[ESC] BEENDEN", "#ff7050", "Escape", 16); }
    else text("Starte MARGIN CALL neu oder schließe diesen Tab.", DW / 2, 282, "#ffffff", 18, "center");
    last = now; requestAnimationFrame(frame); return;
  }
  // Host: Lobby-Status regelmaessig verteilen, Snapshots auch auf Endbildschirmen
  if (isHost() && net.connected) {
    if (state === ST.LOBBY && (lobbyT -= dt) <= 0) { lobbyT = .3; hostSendLobby(); }
  }
  lobbyNoteT -= dt;
  // Spiel im LAN ankuendigen, solange der Host in der Lobby ist (nur in der App bzw. am eigenen Server)
  const shouldAdvertise = isLocalOrigin() && net.connected && isHost() && state === ST.LOBBY;
  if (shouldAdvertise && (advertiseT -= dt) <= 0) {
    advertiseT = 1; advertising = true;
    fetch("/api/host", { method: "POST", body: JSON.stringify({ active: true, name: myGameName(), host: me.name, mode: MODES[lobbyMode][1], players: players.length }) }).catch(() => { });
  } else if (!shouldAdvertise && advertising) {
    advertising = false; fetch("/api/host", { method: "POST", body: JSON.stringify({ active: false }) }).catch(() => { });
  }
  // Offene Spiele suchen, solange "Spiel beitreten" offen ist
  if (state === ST.JOIN && (gamesT -= dt) <= 0) {
    gamesT = 1;
    fetch("/api/games", { cache: "no-store" }).then(r => r.json()).then(l => { foundGames = Array.isArray(l) ? l : []; }).catch(() => { });
  }
  if (isHost() && net.connected && isMP() && state !== ST.PLAY && state !== ST.LOBBY && performance.now() - lastSent > 200) { lastSent = performance.now(); hostSendSnapshot(); }
  switch (state) {
    case ST.TITLE: gameTime += dt; renderTitle(); break;
    case ST.PRIVACY: gameTime += dt; renderPrivacy(); break;
    case ST.NAMEENTRY: gameTime += dt; renderNameEntry(); break;
    case ST.HIGHSCORES: gameTime += dt; renderHighscores(); break;
    case ST.LOBBY: gameTime += dt; renderLobby(); break;
    case ST.PLAY: updateGame(dt); if (state === ST.PLAY) { renderPlay(dt); if (mpMenu) renderMpMenu(); } break;
    case ST.MPMENU: gameTime += dt; renderMpChoice(); break;
    case ST.JOIN: gameTime += dt; renderJoin(); break;
    case ST.PAUSE:
      g.fillStyle = "#000"; g.fillRect(230, 160, 500, 130);
      text("HANDEL AUSGESETZT", DW / 2, 178, "#ffd232", 28, "center");
      zoneButton(250, 228, 145, 40, "[P] WEITER", "#50ff82", "p", 16);
      zoneButton(408, 228, 145, 40, "[O] OPTIONEN", "#50c8ff", "o", 16);
      zoneButton(566, 228, 145, 40, "[ESC] HAUPTMENÜ", "#ff7050", "Escape", 16);
      break;
    case ST.OPTIONS: optMsgT -= dt; renderOptions(); if (isClient() && optReturn === ST.PLAY) updateGame(0); break;
    case ST.LEVELDONE: gameTime += dt; renderEnd("CLOSING BELL!", "Level geschafft – der Kurs steigt", "#50ff82", true); break;
    case ST.ROUNDEND:
      gameTime += dt;
      if (isHost()) { roundT -= dt; if (roundT <= 0) { nextRound(); break; } }   // automatisch weiter nach der Pause
      renderRoundEnd(); break;
    case ST.DEAD: gameTime += dt;
      if (HC()) renderEnd("GAME OVER", "Hardcore: Die Insolvenz ist endgültig – dein Lauf ist vorbei", "#ff3c3c", false);
      else renderEnd("INSOLVENZ", `Insolvenz Nr. ${me.deaths} – Strafe −$${deathPenalty.toLocaleString("de-DE")} (25 % des P&L)`, "#ff3c3c", false);
      break;
    case ST.WIN: gameTime += dt;
      renderEnd("BULLENMARKT!", me.winBonus ? `ALGO-9000 besiegt – Bullenmarkt-Bonus +$${me.winBonus.toLocaleString("de-DE")}${me.deaths ? "" : " inkl. weißer Weste"}` : "ALGO-9000 besiegt – der Markt ist frei", "#ffd232", true);
      break;
  }
  if (edit) { clickZones = []; renderEdit(); }
  requestAnimationFrame(frame);
}

players = [me = makePlayer(0, true)];
musicOn = settings.music !== false;   // gespeicherte Musik-Einstellung
updateHint();
marketsSimulate();
genWalls(); genSprites();
applyMarket();
buildWorld(0);
musicStart();
if (settings.liveData === undefined && !URLP.has("join")) state = ST.PRIVACY;
marketsFetch();
setInterval(marketsFetch, 60000);
fetch("/api/info", { cache: "no-store" }).then(r => r.json()).then(i => { myAddr = `${i.ip}:${i.port}`; }).catch(() => { });
if (URLP.has("join")) enterLobby();
if (IN_APP && settings.fullscreen) setFullscreen(true);
requestAnimationFrame(frame);
</script>
