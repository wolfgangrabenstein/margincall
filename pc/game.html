<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MARGIN CALL</title>
<style>
  :root {
    /* Layout: ein einziger Spielschirm, zentriert auf dunklem Handelssaal-Hintergrund */
    --bg: #05070d;
    --panel: #0b1120;
    --line: #1e7a46;
    --text: #d8e0f0;
    --muted: #6b7896;
    --gold: #ffd23a;
    --font-ui: "Consolas", "Lucida Console", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-inline: 16px; box-sizing: border-box; overflow: hidden;
  }
  #screen {
    width: min(100%, calc((100vh - 60px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9;
    image-rendering: pixelated; background: #000; border: 2px solid var(--line); border-radius: 6px;
    cursor: crosshair;
  }
  #hint { color: var(--muted); font-size: 12px; margin-top: 8px; text-align: center; }
  #touch { display: none; position: fixed; inset: auto 0 0 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; pointer-events: none; }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 54px); gap: 6px; pointer-events: auto; }
  #touch button { width: 54px; height: 54px; border-radius: 10px; border: 1px solid var(--line); background: rgba(11,17,32,.75);
    color: var(--text); font: 700 15px var(--font-ui); touch-action: none; }
  #touch .fire { width: 84px; height: 84px; border-radius: 50%; background: rgba(120,20,20,.8); color: var(--gold); pointer-events: auto; align-self: end; }
  @media (pointer: coarse) { #touch { display: flex; } #hint { display: none; } }
</style>
</head>
<body>
<canvas id="screen" width="960" height="540"></canvas>
<div id="hint"></div>
<div id="touch">
  <div class="pad">
    <button data-k="a">A</button><button data-k="w">▲</button><button data-k="d">D</button>
    <button data-k="ArrowLeft">⟲</button><button data-k="s">▼</button><button data-k="ArrowRight">⟳</button>
  </div>
  <button class="fire" data-k=" ">FEUER</button>
</div>
<script>
"use strict";
// =====================================================================================
// MARGIN CALL – PC-Version (Browser). Gleiche Spiellogik wie die Cardputer-Firmware v3.
// Live-Kurse kommen vom lokalen Spiel-Server (MarginCall.exe) unter /api/market.
// =====================================================================================

const RW = 320, VH = 150, TEX = 32, MAP = 20, NUM_LEVELS = 5;
const PLANE = 0.66, PROJ = RW / (2 * PLANE);
const DW = 960, DH = 540, SC = 3, HUD_Y = VH * SC;

const screen = document.getElementById("screen");
const g = screen.getContext("2d");
const low = document.createElement("canvas"); low.width = RW; low.height = VH;
const lg = low.getContext("2d");
const img = lg.createImageData(RW, VH);
const fb = new Uint32Array(img.data.buffer);

// ---------------------------------------------------------------- Zufall
let rngState = 0x1234567;
function rnd() { rngState ^= rngState << 13; rngState >>>= 0; rngState ^= rngState >>> 17; rngState ^= rngState << 5; rngState >>>= 0; return rngState; }
function frand() { return (rnd() & 0xFFFF) / 65535; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------------------------------------------------------------- Farben (ABGR fuer ImageData)
const RGB = (r, g, b) => ((255 << 24) | (clamp(b|0,0,255) << 16) | (clamp(g|0,0,255) << 8) | clamp(r|0,0,255)) >>> 0;
const css = (r, g, b) => `rgb(${r},${g},${b})`;

// ---------------------------------------------------------------- Markt
const markets = [
  { label: "DOW", name: "Dow Jones", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "S&P", name: "S&P 500", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "NDX", name: "Nasdaq-100", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "OEL", name: "Rohöl WTI", p: 0, prev: 0, chg: 0, s: [], live: false },
];
const M_DOW = 0, M_SPX = 1, M_NDX = 2, M_OIL = 3;
let marketStatus = "SIMULIERT", marketTime = 0;

function marketsSimulate() {
  const base = [51000, 7700, 30000, 90];
  markets.forEach((m, i) => {
    if (m.live) return;
    let v = base[i] * (0.97 + 0.06 * Math.random());
    m.prev = v; m.s = [];
    const drift = (Math.random() * 2 - 1) * 0.0004;
    for (let k = 0; k < 78; k++) { v *= 1 + drift + (Math.random() * 2 - 1) * 0.0015; m.s.push(v); }
    m.p = v; m.chg = (m.p - m.prev) / m.prev * 100;
  });
}
async function marketsFetch() {
  try {
    const r = await fetch("/api/market", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    let live = 0;
    d.markets.forEach((x, i) => {
      if (!x || !x.s || x.s.length < 2) return;
      Object.assign(markets[i], { p: x.p, prev: x.prev, chg: (x.p - x.prev) / x.prev * 100, s: x.s, live: true });
      live++;
    });
    if (live) { marketStatus = "LIVE"; marketTime = d.time * 1000; }
  } catch (e) { if (marketStatus !== "LIVE") marketStatus = "SIMULIERT (kein Server)"; }
  marketsSimulate();
  if (state === ST.PLAY) applyMarket(false);
  buildTicker();
}

// ---------------------------------------------------------------- Texturen
const PCOLOR = [[40, 200, 90], [60, 140, 255], [255, 150, 40], [255, 80, 200]];   // Spielerfarben
const tmp = new Uint32Array(TEX * TEX);
function tclear(c) { tmp.fill(c); }
function tpx(x, y, c) { if (x >= 0 && y >= 0 && x < TEX && y < TEX) tmp[(y|0) * TEX + (x|0)] = c; }
function trect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) tpx(i, j, c); }
function tellipse(cx, cy, rx, ry, c) {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
    if (dx * dx + dy * dy <= 1) tpx(x, y, c);
  }
}
const tcirc = (cx, cy, r, c) => tellipse(cx, cy, r, r, c);
function ttri(x0, y0, x1, y1, x2, y2, c) {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const px = x + .5, py = y + .5;
    const d0 = (x1 - x0) * (py - y0) - (y1 - y0) * (px - x0);
    const d1 = (x2 - x1) * (py - y1) - (y2 - y1) * (px - x1);
    const d2 = (x0 - x2) * (py - y2) - (y0 - y2) * (px - x2);
    const neg = d0 < 0 || d1 < 0 || d2 < 0, pos = d0 > 0 || d1 > 0 || d2 > 0;
    if (!(neg && pos)) tpx(x, y, c);
  }
}
function tline(x0, y0, x1, y1, c, th = 1) {
  let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;) {
    trect(x0, y0, th, th, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
const T = { MARBLE: 0, TICKER: 1, SERVER: 2, GOLD: 3, VAULT: 4, CHART: 5, PIPES: 6, BARRELS: 7, AICORE: 8 };
const wallTex = [];   // [tex][shade] -> Uint32Array
function storeWall(idx) {
  const f = [1, .72, .48, .28];
  wallTex[idx] = f.map(k => {
    const out = new Uint32Array(TEX * TEX);
    for (let i = 0; i < out.length; i++) {
      const c = tmp[i];
      out[i] = RGB((c & 255) * k, ((c >> 8) & 255) * k, ((c >> 16) & 255) * k);
    }
    return out;
  });
}
const S = {}; ["BEAR0","BEAR1","SELL0","SELL1","BUB0","BUB1","SHARK0","SHARK1","BULL0","BULL1","BARON0","BARON1",
  "SLICK0","SLICK1","BOT0","BOT1","ALGO0","ALGO1","DEAD","PROJ","PROJ_OIL","LASER","CASH","DIV",
  "TR0","TR1","TR2","TR3","TRBULL","TRBEAR"].forEach((n, i) => S[n] = i);
const sprTex = [];
function storeSprite(idx) { sprTex[idx] = tmp.slice(); }

function seriesRange(m) {
  let lo = Infinity, hi = -Infinity;
  for (const v of m.s) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (hi - lo < 1e-6) hi = lo + 1;
  return [lo, hi];
}
function genTickerTex(m) {
  tclear(RGB(8, 12, 22));
  const up = m.chg >= 0;
  for (let x = 0; x < TEX; x++) for (let y = 2; y < 9; y++)
    if ((x % 8) < 6 && (rnd() % 3)) tpx(x, y, (((x >> 3) % 3) === 2) !== up ? RGB(40, 230, 90) : RGB(240, 50, 50));
  const [lo, hi] = seriesRange(m), n = m.s.length;
  for (let x = 0; x < TEX; x++) {
    const i = n > 1 ? Math.floor(x * (n - 1) / (TEX - 1)) : 0;
    const y = 29 - Math.floor((m.s[i] - lo) / (hi - lo) * 15);
    for (let yy = y + 1; yy < 31; yy++) tpx(x, yy, up ? RGB(10, 70, 35) : RGB(80, 15, 15));
    tpx(x, y, up ? RGB(80, 255, 130) : RGB(255, 80, 80));
  }
  const py = 29 - Math.floor((m.prev - lo) / (hi - lo) * 15);
  if (py >= 13 && py <= 30) for (let x = 0; x < TEX; x += 3) tpx(x, py, RGB(200, 200, 90));
  for (let i = 0; i < TEX; i++) { tpx(i, 0, RGB(90, 90, 100)); tpx(i, 11, RGB(40, 40, 60)); tpx(i, 31, RGB(90, 90, 100)); }
  storeWall(T.TICKER);
}
function genChartTex(m) {
  tclear(RGB(225, 228, 235));
  for (let y = 4; y < 30; y += 6) trect(1, y, 30, 1, RGB(200, 205, 215));
  const [lo, hi] = seriesRange(m), n = m.s.length;
  const Y = v => 27 - Math.floor((v - lo) / (hi - lo) * 22);
  for (let k = 0; k < 7; k++) {
    const a = Math.floor(k * n / 7), b = Math.max(a + 1, Math.floor((k + 1) * n / 7));
    const o = m.s[a], c = m.s[b - 1]; let h = o, l = o;
    for (let i = a; i < b; i++) { h = Math.max(h, m.s[i]); l = Math.min(l, m.s[i]); }
    const x = 2 + k * 4;
    trect(x + 1, Y(h), 1, Y(l) - Y(h) + 1, RGB(60, 60, 60));
    let t = Y(Math.max(o, c)), bt = Y(Math.min(o, c)); if (bt - t < 1) bt = t + 1;
    trect(x, t, 3, bt - t, c >= o ? RGB(20, 170, 60) : RGB(220, 40, 40));
  }
  for (let i = 0; i < TEX; i++) { tpx(i, 0, RGB(50, 50, 60)); tpx(i, 31, RGB(50, 50, 60)); tpx(0, i, RGB(50, 50, 60)); tpx(31, i, RGB(50, 50, 60)); }
  storeWall(T.CHART);
}

function genWalls() {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const n = Math.floor(frand() * 24) - 12;
    const v = Math.sin(x * .22 + y * .13 + 2.5 * Math.sin(y * .27 + x * .05));
    const base = 196 + n;
    let c = RGB(base, base - 8, base - 26);
    if (Math.abs(v) < .10) c = RGB(120 + n, 115 + n, 110 + n);
    if (y % 16 === 0 || ((x + (y >> 4) * 16) % 32) === 0) c = RGB(140, 130, 112);
    tmp[y * TEX + x] = c;
  }
  storeWall(T.MARBLE);

  tclear(RGB(42, 44, 50));
  for (let y = 0; y < TEX; y += 4) trect(1, y, 30, 1, RGB(20, 20, 24));
  const led = [RGB(40, 255, 80), RGB(60, 140, 255), RGB(255, 180, 30)];
  for (let y = 1; y < TEX; y += 4) {
    for (let x = 3; x < 20; x += 2) tpx(x, y + 1, RGB(28, 28, 32));
    for (let x = 23; x < 30; x += 2) if (rnd() % 2) tpx(x, y + 1, led[rnd() % 3]);
  }
  trect(0, 0, 1, 32, RGB(80, 80, 90)); trect(31, 0, 1, 32, RGB(15, 15, 18));
  storeWall(T.SERVER);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const row = y >> 3, ly = y % 8, lx = (x + (row % 2) * 8) % 16;
    let c;
    if (ly === 7 || lx === 15) c = RGB(80, 50, 10);
    else { const b = 255 - ly * 14 - Math.floor(frand() * 10); c = RGB(b, b * 3 / 4, 30); if (ly === 0) c = RGB(255, 240, 150); }
    tmp[y * TEX + x] = c;
  }
  storeWall(T.GOLD);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const n = rnd() % 12; tmp[y * TEX + x] = RGB(110 + n, 115 + n, 122 + n); }
  tcirc(16, 17, 13, RGB(70, 74, 80)); tcirc(16, 17, 11, RGB(150, 155, 162)); tcirc(16, 17, 4, RGB(60, 62, 68));
  tline(16, 17, 16, 8, RGB(220, 200, 80), 2); tline(16, 17, 8, 22, RGB(220, 200, 80), 2); tline(16, 17, 24, 22, RGB(220, 200, 80), 2);
  for (let a = 0; a < 8; a++) tpx(16 + Math.trunc(12 * Math.cos(a * .785)), 17 + Math.trunc(12 * Math.sin(a * .785)), RGB(40, 40, 40));
  trect(13, 1, 6, 2, RGB(40, 255, 90));
  storeWall(T.VAULT);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const n = rnd() % 14; tmp[y * TEX + x] = RGB(62 + n, 48 + n / 2, 36); }
  for (let p = 0; p < 2; p++) {
    const y0 = p ? 18 : 4;
    for (let y = 0; y < 9; y++) {
      const s = Math.sin((y + .5) / 9 * Math.PI), gg = 50 + Math.floor(130 * s);
      trect(0, y0 + y, 32, 1, p ? RGB(gg, gg * 2 / 3, gg / 3) : RGB(gg * 3 / 4, gg * 3 / 4, gg * 4 / 5));
    }
    for (const fx of [7, 23]) { trect(fx, y0 - 1, 3, 11, RGB(40, 40, 44)); tpx(fx + 1, y0 + 1, RGB(200, 200, 200)); tpx(fx + 1, y0 + 7, RGB(200, 200, 200)); }
  }
  for (let i = 0; i < 6; i++) { const x = rnd() % 32; trect(x, 13 + rnd() % 3, 1, 2 + rnd() % 4, RGB(10, 10, 12)); }
  storeWall(T.PIPES);

  tclear(RGB(20, 18, 16));
  for (let bx = 0; bx < 2; bx++) for (let by = 0; by < 2; by++) {
    const x0 = bx * 16 + 1, y0 = by * 16 + 1;
    for (let x = 0; x < 14; x++) {
      const s = Math.sin((x + .5) / 14 * Math.PI);
      trect(x0 + x, y0, 1, 14, (bx + by) % 2 ? RGB(30 + 60 * s, 40 + 70 * s, 110 + 90 * s) : RGB(120 + 110 * s, 25 + 30 * s, 20 + 20 * s));
    }
    trect(x0, y0 + 3, 14, 1, RGB(15, 15, 15)); trect(x0, y0 + 10, 14, 1, RGB(15, 15, 15));
    tcirc(x0 + 7, y0 + 6.5, 2, RGB(250, 210, 40)); tpx(x0 + 7, y0 + 6, RGB(10, 10, 10));
  }
  storeWall(T.BARRELS);

  tclear(RGB(4, 8, 14));
  for (let x = 1; x < TEX; x += 2) {
    const start = rnd() % 32, len = 6 + rnd() % 14;
    for (let i = 0; i < len; i++) if (rnd() % 3) tpx(x, (start + i) % 32, i === len - 1 ? RGB(200, 255, 220) : RGB(20, 120 + i * 6, 70 + i * 4));
  }
  tcirc(16, 16, 7, RGB(40, 40, 48)); tcirc(16, 16, 5.5, RGB(120, 0, 0)); tcirc(16, 16, 3.5, RGB(255, 30, 20)); tcirc(16, 16, 1.5, RGB(255, 230, 120));
  storeWall(T.AICORE);
}

function genSprites() {
  const N = 0;
  for (let f = 0; f < 2; f++) {   // Baer
    tclear(N);
    const fur = RGB(110, 70, 38), dark = RGB(70, 42, 20);
    tellipse(16, 21, 10, 9, fur);
    tcirc(10, 4, 3, fur); tcirc(22, 4, 3, fur); tcirc(10, 4, 1.5, RGB(200, 120, 120)); tcirc(22, 4, 1.5, RGB(200, 120, 120));
    tcirc(16, 10, 7, fur); tellipse(16, 13, 3.5, 2.5, RGB(175, 125, 85));
    trect(15, 11, 3, 2, RGB(0, 0, 0)); trect(12, 8, 2, 2, RGB(255, 30, 30)); trect(19, 8, 2, 2, RGB(255, 30, 30));
    trect(11, 7, 4, 1, dark); trect(18, 7, 4, 1, dark);
    trect(15, 17, 3, 5, RGB(230, 30, 30)); ttri(12, 22, 21, 22, 16.5, 27, RGB(230, 30, 30));
    trect(9, 28, 5, 4, dark); trect(18, 28, 5, 4, dark);
    if (!f) { trect(4, 17, 4, 9, fur); trect(24, 17, 4, 9, fur); }
    else { trect(3, 9, 4, 10, fur); trect(25, 9, 4, 10, fur); for (let i = 0; i < 3; i++) { tpx(3 + i, 8, RGB(240, 240, 240)); tpx(26 + i, 8, RGB(240, 240, 240)); } }
    storeSprite(S.BEAR0 + f);
  }
  for (let f = 0; f < 2; f++) {   // Bulle
    tclear(N);
    const hide = RGB(55, 38, 26), dark = RGB(30, 20, 14), gold = RGB(245, 200, 60), hy = f ? 3 : 0;
    tellipse(16, 21, 12, 8, hide);
    trect(6, 26, 4, 6, dark); trect(12, 27, 3, 5, dark); trect(18, 27, 3, 5, dark); trect(23, 26, 4, 6, dark);
    ttri(10, 8 + hy, 2, 1 + hy, 7, 11 + hy, gold); ttri(22, 8 + hy, 30, 1 + hy, 25, 11 + hy, gold);
    tcirc(16, 10 + hy, 6.5, hide); tellipse(16, 15 + hy, 4.5, 3, RGB(190, 130, 110));
    tpx(14, 15 + hy, RGB(0, 0, 0)); tpx(18, 15 + hy, RGB(0, 0, 0));
    tcirc(16, 18 + hy, 1.8, gold); tcirc(16, 18 + hy, .9, RGB(190, 130, 110));
    trect(12, 8 + hy, 2, 2, RGB(255, 255, 255)); trect(19, 8 + hy, 2, 2, RGB(255, 255, 255));
    tpx(13, 9 + hy, RGB(200, 0, 0)); tpx(19, 9 + hy, RGB(200, 0, 0));
    trect(15, 21, 3, 5, RGB(30, 210, 70)); ttri(12, 21, 21, 21, 16.5, 16.5, RGB(30, 210, 70));
    if (f) { tcirc(9, 17 + hy, 2, RGB(230, 230, 230)); tcirc(23, 17 + hy, 2, RGB(230, 230, 230)); tcirc(6, 18 + hy, 1.5, RGB(200, 200, 200)); }
    storeSprite(S.BULL0 + f);
  }
  for (let f = 0; f < 2; f++) {   // Short Seller
    tclear(N);
    const suit = RGB(30, 32, 55), skin = RGB(230, 188, 150);
    trect(9, 14, 14, 14, suit); ttri(13, 14, 19, 14, 16, 21, RGB(240, 240, 240)); trect(15, 15, 2, 7, RGB(220, 20, 30));
    trect(10, 28, 5, 4, RGB(20, 20, 30)); trect(17, 28, 5, 4, RGB(20, 20, 30));
    tcirc(16, 8, 5, skin); trect(11, 2, 10, 3, RGB(25, 20, 15)); trect(12, 7, 9, 2, RGB(0, 0, 0)); trect(14, 11, 4, 1, RGB(150, 60, 60));
    trect(6, 15, 3, 11, suit); trect(3, 23, 7, 5, RGB(110, 70, 30)); trect(5, 22, 3, 1, RGB(60, 40, 20));
    if (!f) trect(23, 15, 3, 11, suit);
    else { trect(23, 15, 7, 3, suit); trect(28, 14, 2, 2, skin); tcirc(29, 12, 3, RGB(255, 140, 0)); tcirc(29, 12, 1.5, RGB(255, 255, 160)); }
    storeSprite(S.SELL0 + f);
  }
  for (let f = 0; f < 2; f++) {   // Krypto-Blase
    tclear(N);
    const r = f ? 13 : 11.5, bc = RGB(150, 90, 0);
    tcirc(16, 16, r, f ? RGB(80, 220, 230) : RGB(60, 210, 130)); tcirc(16, 16, r - 1.5, f ? RGB(30, 120, 140) : RGB(25, 110, 70));
    tcirc(16, 16, 6.5, RGB(245, 180, 30)); tcirc(16, 16, 5, RGB(255, 210, 70));
    trect(14, 12, 2, 9, bc); trect(14, 12, 4, 1, bc); trect(14, 16, 4, 1, bc); trect(14, 20, 4, 1, bc);
    trect(18, 13, 1, 3, bc); trect(18, 17, 1, 3, bc); tpx(15, 11, bc); tpx(15, 21, bc);
    tcirc(9, 9, 2, RGB(255, 255, 255));
    storeSprite(S.BUB0 + f);
  }
  for (let f = 0; f < 2; f++) {   // Hai
    tclear(N);
    const grey = RGB(105, 118, 140), mh = f ? 6 : 3;
    ttri(16, 1, 10, 12, 22, 12, grey); tellipse(16, 18, 14, 9, grey); tellipse(16, 22, 10, 4.5, RGB(230, 235, 240));
    tcirc(9, 15, 2, RGB(0, 0, 0)); tpx(9, 14, RGB(255, 40, 40)); tcirc(23, 15, 2, RGB(0, 0, 0)); tpx(23, 14, RGB(255, 40, 40));
    trect(8, 20, 16, mh, RGB(60, 0, 10));
    for (let x = 8; x < 24; x += 3) { ttri(x, 20, x + 3, 20, x + 1.5, 22, RGB(255, 255, 255)); ttri(x, 20 + mh, x + 3, 20 + mh, x + 1.5, 18 + mh, RGB(255, 255, 255)); }
    trect(12, 27, 8, 3, RGB(25, 25, 40)); trect(15, 27, 2, 5, RGB(220, 20, 30)); trect(5, 25, 4, 5, RGB(255, 210, 50));
    storeSprite(S.SHARK0 + f);
  }
  for (let f = 0; f < 2; f++) {   // Oelbaron
    tclear(N);

// Wandabstand entlang eines Strahls (fuer Treffer aller Spieler)
function castRay(ox, oy, dx, dy) {
  let mx = Math.floor(ox), my = Math.floor(oy);
  const ddx = dx === 0 ? 1e30 : Math.abs(1 / dx), ddy = dy === 0 ? 1e30 : Math.abs(1 / dy);
  let stepX, stepY, sdx, sdy;
  if (dx < 0) { stepX = -1; sdx = (ox - mx) * ddx; } else { stepX = 1; sdx = (mx + 1 - ox) * ddx; }
  if (dy < 0) { stepY = -1; sdy = (oy - my) * ddy; } else { stepY = 1; sdy = (my + 1 - oy) * ddy; }
  for (let i = 0; i < 64; i++) {
    let d;
    if (sdx < sdy) { d = sdx; sdx += ddx; mx += stepX; } else { d = sdy; sdy += ddy; my += stepY; }
    if (solidCell(mx, my)) return d;
  }
  return 64;
}
const canHitPlayer = (shooter, pl) => pl !== shooter && !pl.dead && (mode === "dm" || (mode === "team" && pl.team !== shooter.team));
function doShot(pl, ox, oy, dx, dy) {   // nur auf dem Host
  if (pl.dead) return;
  if (pl.ammo <= 0) { sayTo(pl, "KEINE LIQUIDITÄT! CASH SAMMELN", 1.2); sfxTo(pl, "DECLINED"); return; }
  pl.ammo--;
  if (!pl.local) sfxAt("SHOT", ox, oy, 9, pl.id);
  const wall = castRay(ox, oy, dx, dy);
  let best = null, bestD = wall;
  const test = (o, r) => {
    const rx = o.x - ox, ry = o.y - oy, along = rx * dx + ry * dy;
    if (along < .2 || along >= bestD) return;
    if (Math.abs(rx * -dy + ry * dx) < r) { best = o; bestD = along; }
  };
  for (const e of enemies) {
    if (!e.alive) continue;
    if (mode === "team" && e.f === teamFaction(pl)) continue;   // eigene Tiere nicht treffbar
    test(e, .32 * TYPES[e.type].scale);
  }
  for (const o of players) if (canHitPlayer(pl, o)) test(o, .3);
  if (!best) return;
  if (best.isPlayer) { damagePlayer(best, 12 * teamDmgMul(pl), "TREFFER!", pl); sfxTo(pl, "HIT"); }
  else hurtEnemy(best, Math.round(2 * teamDmgMul(pl)), pl);
}
function shoot() {
  if (fireCd > 0 || me.dead) return;
  if (me.ammo <= 0) { fireCd = .4; if (!isClient()) doShot(me, px, py, dirX, dirY); else { say("KEINE LIQUIDITÄT! CASH SAMMELN", 1.2); sfx("DECLINED"); } return; }
  fireCd = .28; flashT = .12; sfx("SHOT");
  if (isClient()) { me.ammo--; netSend({ t: "shot", x: +px.toFixed(3), y: +py.toFixed(3), dx: +dirX.toFixed(4), dy: +dirY.toFixed(4) }); }
  else doShot(me, px, py, dirX, dirY);
}

// ---------------------------------------------------------------- Gegner-KI (Host)
const hostileToPlayer = (e, pl) => !(mode === "team" && (e.f === F.BULL || e.f === F.BEAR) && teamFaction(pl) === e.f);
function nearestPlayer(e, maxD, needLos) {
  let best = null, bd = maxD;
  for (const pl of players) {
    if (pl.dead || !hostileToPlayer(e, pl)) continue;
    const d = Math.hypot(pl.x - e.x, pl.y - e.y);
    if (d < bd && (!needLos || lineOfSight(e.x, e.y, pl.x, pl.y))) { bd = d; best = pl; }
  }
  return best;
}
function chooseTarget(e) {
  let bt = null, best = 1e9;
  const pl = nearestPlayer(e, 11, true);
  if (pl) { bt = pl; best = Math.hypot(pl.x - e.x, pl.y - e.y); }
  if (crashT <= 0) for (const o of enemies) {
    if (o === e || !o.alive || !hostile(e.f, o.f)) continue;
    const d = Math.hypot(o.x - e.x, o.y - e.y);
    if (d > 8 || d * .6 > best || !lineOfSight(e.x, e.y, o.x, o.y)) continue;
    best = d * .6; bt = o;
  }
  e.target = bt;
}
function meleeHit(e, dmgP, dmgE, why) {
  const t = e.target;
  if (!t) return;
  if (t.isPlayer) damagePlayer(t, Math.floor(dmgP * e.str), why);
  else { hurtEnemy(t, Math.ceil(dmgE * e.str), null); sfxNear(e.f === F.BULL ? "BULL" : "ROAR", e.x, e.y, 6); }
}
function updateEnemy(e, dt) {
  e.anim += dt; e.hurt -= dt; e.cd -= dt * fireRateMul(); e.attackAnim -= dt; e.chargeCd -= dt; e.think -= dt;
  const spd = crashT > 0 ? 1.4 : 1, animal = e.f === F.BULL || e.f === F.BEAR;
  if (animal && e.think <= 0) { e.think = .4; chooseTarget(e); if (e.target) e.awake = true; }
  let t = e.target;
  if (!animal) t = nearestPlayer(e, 40, false);
  if (t && (t.isPlayer ? t.dead : !t.alive)) { e.target = null; t = null; }
  if (!t) {
    if (animal && !moveEntity(e, e.mdx * .6 * dt, e.mdy * .6 * dt, .25) || frand() < dt * .3) { const a = frand() * 6.283; e.mdx = Math.cos(a); e.mdy = Math.sin(a); }
    return;
  }
  const tx = t.x, ty = t.y, dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy) + 1e-4, nx = dx / d, ny = dy / d, ang = Math.atan2(dy, dx);

  if (!animal) {
    const los = d < 12 && lineOfSight(e.x, e.y, tx, ty);
    if (!e.awake) { if (los && d < 9) e.awake = true; else return; }
    switch (e.type) {
      case E.SHARK:
        if (d > 3 || !los) moveEntity(e, nx * 1.2 * dt, ny * 1.2 * dt, .35);
        if (d < .9 && e.cd <= 0) { e.cd = 1; damagePlayer(t, 20, "FEINDLICHE ÜBERNAHME!"); }
        if (los && e.cd <= 0) { e.cd = 1.3; e.attackAnim = .4; for (let k = -1; k <= 1; k++) spawnProj(e.x, e.y, ang + k * .18, 4, 10, F.NEUTRAL, S.PROJ); sfxNear("ZAP", e.x, e.y, 12); }
        return;
      case E.BARON:
        if (d > 4.5 || !los) moveEntity(e, nx * dt, ny * dt, .25); else if (d < 2.5) moveEntity(e, -nx * .8 * dt, -ny * .8 * dt, .25);
        if (los && e.cd <= 0 && d < 10) { e.cd = 2 + frand(); e.attackAnim = .4; spawnProj(e.x, e.y, ang, 3.4, 10, F.NEUTRAL, S.PROJ_OIL); sfxNear("OIL", e.x, e.y, 10); }
        return;
      case E.SLICK:
        if (d > .7) moveEntity(e, nx * .9 * dt * spd, ny * .9 * dt * spd, .25);
        else if (e.cd <= 0) { e.cd = 1.2; e.attackAnim = .3; t.slowT = 3; sfxTo(t, "OIL"); damagePlayer(t, 8, "ÖLPEST! DU KLEBST FEST"); }
        return;
      case E.BOT: {
        const w = Math.sin(e.anim * 3) * .6;
        if (d > 3.2 || !los) moveEntity(e, (nx - ny * w) * 2 * dt, (ny + nx * w) * 2 * dt, .2);
        else moveEntity(e, -ny * w * 1.5 * dt, nx * w * 1.5 * dt, .2);
        if (los && e.cd <= 0 && d < 10) { e.cd = 1.3 + frand() * .5; e.attackAnim = .25; spawnProj(e.x, e.y, ang + (frand() - .5) * .1, 6, 6, F.AI, S.LASER); sfxNear("LASER", e.x, e.y, 10); }
        return;
      }
      case E.ALGO:
        e.spawnCd -= dt;
        if (los && e.cd <= 0) { e.cd = 1.2; e.attackAnim = .5; for (let k = -2; k <= 2; k++) spawnProj(e.x, e.y, ang + k * .14, 5, 8, F.AI, S.LASER); sfxNear("LASER", e.x, e.y, 14); }
        if (e.spawnCd <= 0) { e.spawnCd = 8; spawnNear(E.BOT, 2); }
        if (!e.halfDone && e.hp < e.maxhp / 2) { e.halfDone = true; aiEvent(1); }
        return;
    }
    return;
  }
  const hitMsg = e.f === F.BULL ? "BULLE RAMMT DICH! KURSSPRUNG" : "BÄRENTATZE! KURSVERLUST";
  switch (e.type) {
    case E.BEAR:
      if (d > .75) moveEntity(e, nx * 1.5 * dt * spd, ny * 1.5 * dt * spd, .25);
      else if (e.cd <= 0) { e.cd = 1; e.attackAnim = .3; meleeHit(e, 12, 2, hitMsg); }
      break;
    case E.BULL:
      if (e.chargeT > 0) {
        e.chargeT -= dt;
        if (!moveEntity(e, e.mdx * 5 * dt, e.mdy * 5 * dt, .25)) e.chargeT = 0;
        if (d < .75) { e.chargeT = 0; e.cd = 1; meleeHit(e, 15, 3, hitMsg); }
      } else if (d > .75) {

          e.chargeT = .7; e.chargeCd = 3.5 + frand() * 2; e.mdx = nx; e.mdy = ny; e.attackAnim = .7; sfxNear("BULL", e.x, e.y, 8);
        }
      } else if (e.cd <= 0) { e.cd = 1.1; e.attackAnim = .3; meleeHit(e, 10, 2, hitMsg); }
      break;
    case E.SELLER:
      if (d > 4) moveEntity(e, nx * 1.1 * dt, ny * 1.1 * dt, .25); else if (d < 2.2) moveEntity(e, -nx * .9 * dt, -ny * .9 * dt, .25);
      if (e.cd <= 0 && d < 10 && lineOfSight(e.x, e.y, tx, ty)) { e.cd = 1.6 + frand(); e.attackAnim = .3; spawnProj(e.x, e.y, ang + (frand() - .5) * .12, 4.5, 8, F.BEAR, S.PROJ); sfxNear("ZAP", e.x, e.y, 10); }

}

// ---------------------------------------------------------------- Netzwerk
function netSend(obj) { if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(obj)); }

function netConnect() {
  if (location.protocol === "file:") { netNotice("MULTIPLAYER NUR IN DER MARGIN CALL APP"); return; }
  netDisconnect();
  const ws = new WebSocket(`ws://${location.host}/ws`);
  net.ws = ws;
  ws.onmessage = ev => netReceive(JSON.parse(ev.data));
  ws.onclose = () => {
    if (net.ws !== ws) return;
    net.ws = null; net.connected = false;
    if (isMP() || state === ST.LOBBY) { leaveMP(); netNotice("VERBINDUNG ZUM SPIEL BEENDET"); }
  };
  ws.onerror = () => netNotice("KEINE VERBINDUNG ZUM SPIEL-SERVER");
}
function netDisconnect() { if (net.ws) { const ws = net.ws; net.ws = null; ws.close(); } net.connected = false; }
function leaveMP() {
  if (IN_APP && !isLocalOrigin()) { goHome(); return; }
  netDisconnect(); mpMenu = false;
  mode = "solo"; players = [me = makePlayer(0, true)];
  state = ST.TITLE; musicStart();
  document.exitPointerLock?.();
}
function enterLobby() { netConnect(); state = ST.LOBBY; lobbyInfo = []; }
function syncPlayersWithPeers(ids) {
  for (const id of ids) if (!players.some(p => p.id === id)) players.push(makePlayer(id, id === net.id));
  players = players.filter(p => ids.includes(p.id));
  me = players.find(p => p.id === net.id) || me;
}
function netReceive(m) {
  switch (m.t) {
    case "full": netNotice("SPIEL IST VOLL (MAX. 4 SPIELER)"); netDisconnect(); state = ST.TITLE; return;
    case "welcome":
      net.id = m.id; net.hostId = m.host; net.connected = true;
      players = [me = makePlayer(m.id, true)];
      return;
    case "peers": {
      const hostLeft = net.hostId && m.host !== net.hostId;
      net.hostId = m.host;
      if (hostLeft && (state !== ST.LOBBY)) { leaveMP(); netNotice("DER HOST HAT DAS SPIEL VERLASSEN"); return; }
      if (isHost() || state === ST.LOBBY) syncPlayersWithPeers(m.ids);
      return;
    }
  }
  if (isHost()) {   // Nachrichten von Mitspielern
    const pl = players.find(p => p.id === m.from);
    if (!pl) return;
    switch (m.t) {
      case "me": if (!pl.dead) { pl.x = m.x; pl.y = m.y; pl.dirX = m.dx; pl.dirY = m.dy; } break;
      case "shot": if (state === ST.PLAY) doShot(pl, m.x, m.y, m.dx, m.dy); break;
      case "team": if (state === ST.LOBBY) pl.team = m.team ? 1 : 0; break;
    }
    return;
  }
  // Mitspieler: Lobby und Spielzustand vom Host
  if (m.t === "lobby") {
    lobbyMode = m.mode; lobbyInfo = m.players;
    if (state !== ST.LOBBY && state !== ST.OPTIONS) state = ST.LOBBY;
  } else if (m.t === "snap") clientSnapshot(m);
}

  netSend({ t: "lobby", to: "all", mode: lobbyMode, players: players.map(p => [p.id, p.name, p.team]) });
}
function hostStartGame() {
  mode = MODES[lobbyMode][0];
  players.forEach(p => { p.hp = 100; p.ammo = 30; p.score = 0; p.kills = 0; p.dead = false; });
  newGame(); state = ST.PLAY; fireCd = .4; sfxAll("KACHING");
}
const r2 = v => Math.round(v * 100) / 100;
function hostSendSnapshot() {
  const snap = {

    fx: [r2(fakeT), r2(glitchT), r2(aiFaceT), r2(invertT), r2(crashT)], ba: [bullsAlive, bearsAlive], mk: marketKills,
    pl: players.map(p => [p.id, r2(p.x), r2(p.y), r2(p.dirX), r2(p.dirY), p.hp, p.ammo, p.score, p.dead ? 1 : 0, p.team, Math.ceil(p.respawnT), p.slowT > 0 ? 1 : 0, p.kills]),

let musicSources = [], serverGone = false, pingFails = 0;
const musicAudible = () => musicOn && musicRunning && !document.hidden && !serverGone &&
  state !== ST.PAUSE && !(state === ST.OPTIONS && optReturn === ST.PAUSE);
function musicKill() {
  for (const s of musicSources) { try { s.stop(); } catch (e) { } }
  musicSources = []; musicTime = 0;
}
function musicSchedule() {
  if (!actx) return;
  if (!musicAudible()) { if (musicSources.length) musicKill(); return; }
  if (musicTime < actx.currentTime + .05) musicTime = actx.currentTime + .05;
  while (musicTime < actx.currentTime + .6) {
    const b = actx.createBuffer(1, CHUNK, MR); renderMusic(b.getChannelData(0));
    const src = actx.createBufferSource(); src.buffer = b; src.connect(musicGain); src.start(musicTime);
    src.onended = () => { const i = musicSources.indexOf(src); if (i >= 0) musicSources.splice(i, 1); };
    musicSources.push(src);
    musicTime += CHUNK / MR;
  }
}
function musicStart() { musicKill(); musicReset(); musicRunning = true; }
function musicStop() { musicRunning = false; musicKill(); }
function musicToggle() { musicOn = !musicOn; musicSchedule(); }
setInterval(musicSchedule, 60);

// Tab im Hintergrund: alle Toene anhalten
document.addEventListener("visibilitychange", () => {
  if (!actx) return;
  if (document.hidden) { musicKill(); actx.suspend(); } else if (!serverGone) actx.resume();
});
// Spiel-Server (MarginCall.exe) beendet? Dann verstummt das Spiel und zeigt einen Hinweis.
setInterval(async () => {
  if (location.protocol === "file:") return;
  try {
    const r = await fetch("/api/ping", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    pingFails = 0;
    if (serverGone) { serverGone = false; if (actx && !document.hidden) actx.resume(); }
  } catch (e) {
    if (++pingFails >= 2 && !serverGone) { serverGone = true; musicKill(); if (actx) actx.suspend(); document.exitPointerLock?.(); }
  }
}, 3000);

// ---------------------------------------------------------------- Hosten / Beitreten / MP-Menue
function renderMpChoice() {
  chartBackground("#123a26", "#3a1414");
  g.fillStyle = "rgba(0,0,0,.88)"; g.fillRect(160, 90, DW - 320, 340);
  text("MULTIPLAYER", DW / 2, 110, "#ffd232", 40, "center");
  text("[H] SPIEL HOSTEN", DW / 2, 190, "#50c8ff", 26, "center");
  text(`Mitspieler treten bei über: ${myAddr || "…"}`, DW / 2, 226, "#a0a0b4", 16, "center");
  text("[J] SPIEL BEITRETEN", DW / 2, 290, "#50ff82", 26, "center");
  text("Adresse des Hosts eingeben (steht in seiner Lobby)", DW / 2, 326, "#a0a0b4", 16, "center");
  text("[ESC] ZURÜCK", DW / 2, 390, "#8290b0", 16, "center");
}
function renderJoin() {
  chartBackground("#123a26", "#3a1414");
  g.fillStyle = "rgba(0,0,0,.88)"; g.fillRect(160, 120, DW - 320, 280);
  text("SPIEL BEITRETEN", DW / 2, 140, "#ffd232", 36, "center");
  text("Adresse des Hosts, z. B. 192.168.1.20:8080", DW / 2, 196, "#a0a0b4", 16, "center");
  g.strokeStyle = "#50ff82"; g.lineWidth = 2; g.strokeRect(240, 230, DW - 480, 46);
  text(joinText + (Math.floor(gameTime * 3) % 2 ? "▌" : ""), 256, 242, "#ffffff", 24);
  text("[ENTER] VERBINDEN · [ESC] ZURÜCK", DW / 2, 330, "#8290b0", 16, "center");
}
function joinKey(k) {
  if (k === "Escape") { state = ST.MPMENU; return; }
  if (k === "Backspace") { joinText = joinText.slice(0, -1); return; }
  if (k === "enter") {
    const host = joinText.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
    if (!host) return;
    location.href = appUrl(`http://${host.includes(":") ? host : host + ":8080"}`, "&join=1");
    return;
  }
  if (k.length === 1 && /[0-9a-z.:\-]/.test(k) && joinText.length < 40) joinText += k;
}
function renderMpMenu() {
  g.fillStyle = "rgba(0,0,0,.88)"; g.fillRect(250, 150, 460, 160);
  text("MULTIPLAYER-MENÜ", DW / 2, 166, "#ffd232", 26, "center");
  text("Das Spiel läuft weiter!", DW / 2, 202, "#ff7050", 16, "center");
  text("[L] SPIEL VERLASSEN · [Q] BEENDEN", DW / 2, 236, "#ffffff", 18, "center");
  text(`[${bindText("pause")}] ZURÜCK INS SPIEL`, DW / 2, 268, "#8290b0", 16, "center");
}

// ---------------------------------------------------------------- Hauptschleife
let last = performance.now(), lobbyT = 0;
function renderPlay() {
  renderWalls(); renderSprites(); renderGlitch();
  lg.putImageData(img, 0, 0); if (!me.dead) renderWeapon();
  g.drawImage(low, 0, 0, RW, VH, 0, 0, DW, HUD_Y);
  renderHUD();
}
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  g.imageSmoothingEnabled = false;
  netMsgT -= dt;
  musicSchedule();   // sofort reagieren, wenn Pause an/aus geht
  if (serverGone) {   // Spiel einfrieren, bis der Server wieder da ist
    g.fillStyle = "rgba(0,0,0,.85)"; g.fillRect(0, 170, DW, 170);
    text(IN_APP ? "DER HOST HAT DAS SPIEL BEENDET" : "SPIEL-SERVER BEENDET", DW / 2, 190, "#ff5050", 36, "center");
    text("Die Verbindung ist weg. Musik und Spiel sind angehalten.", DW / 2, 248, "#dcdce6", 18, "center");
    text(IN_APP ? "[H] ZURÜCK ZU MEINEM SPIEL · [Q] BEENDEN" : "Starte MARGIN CALL neu oder schließe diesen Tab.", DW / 2, 282, "#ffffff", 18, "center");
    last = now; requestAnimationFrame(frame); return;
  }
  // Host: Lobby-Status regelmaessig verteilen, Snapshots auch auf Endbildschirmen
  if (isHost() && net.connected) {
    if (state === ST.LOBBY && (lobbyT -= dt) <= 0) { lobbyT = .3; hostSendLobby(); }
    if (isMP() && state !== ST.PLAY && state !== ST.LOBBY && performance.now() - lastSent > 200) { lastSent = performance.now(); hostSendSnapshot(); }
  }
  switch (state) {
    case ST.TITLE: gameTime += dt; renderTitle(); break;
    case ST.LOBBY: gameTime += dt; renderLobby(); break;
    case ST.PLAY: updateGame(dt); if (state === ST.PLAY) { renderPlay(); if (mpMenu) renderMpMenu(); } break;
    case ST.MPMENU: gameTime += dt; renderMpChoice(); break;
    case ST.JOIN: gameTime += dt; renderJoin(); break;
    case ST.PAUSE:
      g.fillStyle = "#000"; g.fillRect(260, 170, 440, 110);
      text("HANDEL AUSGESETZT", DW / 2, 190, "#ffd232", 28, "center");
      text(`[${bindText("pause")}] WEITER · [O] OPTIONEN · [Q] BEENDEN`, DW / 2, 236, "#dcdce6", 18, "center");
      break;
    case ST.OPTIONS: optMsgT -= dt; renderOptions(); if (isClient() && optReturn === ST.PLAY) updateGame(0); break;
    case ST.LEVELDONE: gameTime += dt; renderEnd("CLOSING BELL!", "Level geschafft – der Kurs steigt", "#50ff82", true); break;
    case ST.ROUNDEND: gameTime += dt; renderRoundEnd(); break;
    case ST.DEAD: gameTime += dt; renderEnd("INSOLVENZ", "Dein Depot ist auf null", "#ff3c3c", false); break;
    case ST.WIN: gameTime += dt; renderEnd("BULLENMARKT!", "ALGO-9000 besiegt – der Markt ist frei", "#ffd232", true); break;
  }
  requestAnimationFrame(frame);
}

players = [me = makePlayer(0, true)];
updateHint();
marketsSimulate();
genWalls(); genSprites();
applyMarket();
buildWorld(0);
musicStart();
marketsFetch();
setInterval(marketsFetch, 60000);
fetch("/api/info", { cache: "no-store" }).then(r => r.json()).then(i => { myAddr = `${i.ip}:${i.port}`; }).catch(() => { });
if (URLP.has("join")) enterLobby();
requestAnimationFrame(frame);
</script>
