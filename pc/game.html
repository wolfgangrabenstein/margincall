<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MARGIN CALL</title>
<style>
  :root {
    /* Layout: ein einziger Spielschirm, zentriert auf dunklem Handelssaal-Hintergrund */
    --bg: #05070d;
    --panel: #0b1120;
    --line: #1e7a46;
    --text: #d8e0f0;
    --muted: #6b7896;
    --gold: #ffd23a;
    --font-ui: "Consolas", "Lucida Console", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-inline: 16px; box-sizing: border-box; overflow: hidden;
  }
  #screen {
    width: min(100%, calc((100vh - 60px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9;
    image-rendering: pixelated; background: #000; border: 2px solid var(--line); border-radius: 6px;
    cursor: crosshair;
  }
  #hint { color: var(--muted); font-size: 12px; margin-top: 8px; text-align: center; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  /* Smartphone: Steuerung nur waehrend des Spiels ueber dem Bild (linke Haelfte = Stick, rechte Haelfte = Drehen) */
  #touch { display: none; position: fixed; inset: 0; z-index: 5; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.playing #touch { display: block; }
  body.touchhelp #touch { display: block; pointer-events: none; }
  body.touchhelp #touch * { pointer-events: none; }
  #stickBase { display: none; position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.07); pointer-events: none; }
  #stickKnob { position: absolute; left: 35px; top: 35px; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.38); }
  #touch button { position: absolute; border-radius: 50%; font: 700 15px var(--font-ui); touch-action: none; color: var(--text);
    background: rgba(11,17,32,.55); border: 2px solid rgba(255,255,255,.3); }
  #touch #tDodge { right: calc(26px + env(safe-area-inset-right, 0px)); bottom: 30%; width: 76px; height: 76px; padding: 0;
    background: rgba(11,17,32,.55); border-color: rgba(255,210,58,.7); display: flex; align-items: center; justify-content: center; }
  #touch #tDodge svg { width: 40px; height: 40px; }
  #fsBtn { display: none; position: fixed; z-index: 7; right: calc(10px + env(safe-area-inset-right, 0px)); top: 10px; width: 44px; height: 44px;
    border-radius: 12px; border: 2px solid rgba(255,255,255,.35); background: rgba(11,17,32,.6); color: var(--text); padding: 0; touch-action: manipulation; }
  #touch #tPause svg, #fsBtn svg { width: 24px; height: 24px; display: block; margin: auto; }
  #touch #tPause { padding: 0; background: rgba(11,17,32,.6); border-color: rgba(255,255,255,.4); left: calc(14px + env(safe-area-inset-left, 0px)); top: 14px; width: 50px; height: 50px; font-size: 18px; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 6; background: rgba(5,7,13,.94); color: var(--gold);
    font: 700 20px var(--font-ui); align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #kbd { position: fixed; left: -200px; top: 0; width: 10px; height: 10px; opacity: 0; }
  @media (pointer: coarse) {
    body { padding: 0; }
    body.canfs #fsBtn { display: block; }
    #screen { width: min(100vw, calc(100vh * 16 / 9)); border: 0; border-radius: 0; }
    #hint { display: none; }
  }
  @media (pointer: coarse) and (orientation: portrait) { body.playing #rotate { display: flex; } }
</style>

<body>
<canvas id="screen" width="960" height="540"></canvas>

</div>

<input id="kbd" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-hidden="true">
<script>
"use strict";
// =====================================================================================
// MARGIN CALL – PC-Version (Browser). Gleiche Spiellogik wie die Cardputer-Firmware v3.
// Live-Kurse kommen vom lokalen Spiel-Server (MarginCall.exe) unter /api/market.
// =====================================================================================

// Sprache: Englisch ist Standard, Deutsch per Optionsmenue. L(en, de) waehlt den passenden Text.
const L = (en, de) => { try { return settings.lang === "de" ? de : en; } catch (e) { return en; } };
const LOC = () => L("en-US", "de-DE");
const APP_VERSION = "3.38.1";
// Online-Rangliste (Cloudflare Worker, siehe worker/README.md). Leer = nicht eingerichtet, dann ist alles Online ausgeblendet.
const ONLINE_HS_URL = "https://margincall-highscores.margincall.workers.dev";
const RW = 320, VH = 150, TEX = 32, MAP = 20, NUM_LEVELS = 5;
const PLANE = 0.66, PROJ = RW / (2 * PLANE);
const DW = 960, DH = 540, SC = 3, HUD_Y = VH * SC;

const screen = document.getElementById("screen");
const g = screen.getContext("2d");
const low = document.createElement("canvas"); low.width = RW; low.height = VH;
const lg = low.getContext("2d");
const img = lg.createImageData(RW, VH);
const fb = new Uint32Array(img.data.buffer);

// ---------------------------------------------------------------- Zufall
let rngState = 0x1234567;
function rnd() { rngState ^= rngState << 13; rngState >>>= 0; rngState ^= rngState >>> 17; rngState ^= rngState << 5; rngState >>>= 0; return rngState; }
function frand() { return (rnd() & 0xFFFF) / 65535; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------------------------------------------------------------- Farben (ABGR fuer ImageData)
const RGB = (r, g, b) => ((255 << 24) | (clamp(b|0,0,255) << 16) | (clamp(g|0,0,255) << 8) | clamp(r|0,0,255)) >>> 0;
const css = (r, g, b) => `rgb(${r},${g},${b})`;

// ---------------------------------------------------------------- Markt
const markets = [
  { label: "DOW", name: "Dow Jones", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "S&P", name: "S&P 500", p: 0, prev: 0, chg: 0, s: [], live: false },
  { label: "NDX", name: "Nasdaq-100", p: 0, prev: 0, chg: 0, s: [], live: false },
  { get label() { return L("OIL", "ÖL"); }, get name() { return L("Crude Oil WTI", "Rohöl WTI"); }, p: 0, prev: 0, chg: 0, s: [], live: false },
];
const M_DOW = 0, M_SPX = 1, M_NDX = 2, M_OIL = 3;
// Einzelwerte je Index – nur fuer den Ticker, auf das Spiel wirken allein die Leitindizes
const STOCKS = [["GS", 0], ["CAT", 0], ["HD", 0], ["JPM", 0], ["BA", 0], ["KO", 0],
  ["AAPL", 1], ["AMZN", 1], ["GOOGL", 1], ["META", 1], ["LLY", 1], ["BRK-B", 1],
  ["NVDA", 2], ["MSFT", 2], ["AVGO", 2], ["TSLA", 2], ["NFLX", 2], ["AMD", 2], ["XOM", 3], ["CVX", 3]]
  .map(([sym, m]) => ({ sym, label: sym.replace("-", "."), m, p: 0, chg: 0, live: false }));
let marketStatus = "sim", marketTime = 0;
const mStat = () => marketStatus === "LIVE" ? "LIVE" : marketStatus === "nosrv" ? L("SIMULATED (no server)", "SIMULIERT (kein Server)") : L("SIMULATED", "SIMULIERT");

function marketsSimulate(force = false) {   // simulierte Kurse bleiben bis zum naechsten Lauf (force) gleich
  const base = [51000, 7700, 30000, 90];
  markets.forEach((m, i) => {
    if (m.live || (m.sim && !force)) return;
    m.sim = true;
    let v = base[i] * (0.97 + 0.06 * Math.random());
    m.prev = v; m.s = [];
    const drift = (Math.random() * 2 - 1) * 0.0002;
    for (let k = 0; k < 78; k++) { v *= 1 + drift + (Math.random() * 2 - 1) * 0.0015; m.s.push(v); }
    m.p = v; m.chg = (m.p - m.prev) / m.prev * 100;
  });
  // simulierte Einzelwerte folgen grob ihrem Index (ohne Preis, nur Veraenderung)
  for (const s of STOCKS) if (!s.live && (!s.sim || force)) { s.sim = true; s.p = 0; s.chg = markets[s.m].chg + (Math.random() * 2 - 1) * 1.5; }
}
async function marketsFetch() {
  if (settings.liveData !== true) {   // Datenschutz: ohne Zustimmung keine Anfrage an Yahoo Finance
    markets.forEach(m => m.live = false); STOCKS.forEach(s => s.live = false);
    marketStatus = "sim"; marketsSimulate(); buildTicker(); return;
  }
  try {
    const r = await fetch(WEB_BUILD ? ONLINE_HS_URL + "/market" : "/api/market", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    let live = 0;
    d.markets.forEach((x, i) => {
      if (!x || !x.s || x.s.length < 2) return;
      Object.assign(markets[i], { p: x.p, prev: x.prev, chg: (x.p - x.prev) / x.prev * 100, s: x.s, live: true, sim: false });
      live++;
    });
    for (const s of STOCKS) {
      const x = d.stocks && d.stocks[s.sym];
      if (x && x.prev) Object.assign(s, { p: x.p, chg: (x.p - x.prev) / x.prev * 100, live: true });
    }
    if (live) { marketStatus = "LIVE"; marketTime = d.time * 1000; }
  } catch (e) { if (marketStatus !== "LIVE") marketStatus = "nosrv"; }
  marketsSimulate();
  if (state === ST.PLAY) applyMarket(false);
  buildTicker();
}

// ---------------------------------------------------------------- Texturen
const PCOLOR = [[40, 200, 90], [60, 140, 255], [255, 150, 40], [255, 80, 200]];   // Spielerfarben
const tmp = new Uint32Array(TEX * TEX);
function tclear(c) { tmp.fill(c); }
function tpx(x, y, c) { if (x >= 0 && y >= 0 && x < TEX && y < TEX) tmp[(y|0) * TEX + (x|0)] = c; }
function trect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) tpx(i, j, c); }
function tellipse(cx, cy, rx, ry, c) {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
    if (dx * dx + dy * dy <= 1) tpx(x, y, c);
  }
}
const tcirc = (cx, cy, r, c) => tellipse(cx, cy, r, r, c);
function ttri(x0, y0, x1, y1, x2, y2, c) {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const px = x + .5, py = y + .5;
    const d0 = (x1 - x0) * (py - y0) - (y1 - y0) * (px - x0);
    const d1 = (x2 - x1) * (py - y1) - (y2 - y1) * (px - x1);
    const d2 = (x0 - x2) * (py - y2) - (y0 - y2) * (px - x2);
    const neg = d0 < 0 || d1 < 0 || d2 < 0, pos = d0 > 0 || d1 > 0 || d2 > 0;
    if (!(neg && pos)) tpx(x, y, c);
  }
}
function tline(x0, y0, x1, y1, c, th = 1) {
  let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;) {
    trect(x0, y0, th, th, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
const T = { MARBLE: 0, TICKER: 1, SERVER: 2, GOLD: 3, VAULT: 4, CHART: 5, PIPES: 6, BARRELS: 7, AICORE: 8 };
const wallTex = [];   // [tex][shade] -> Uint32Array
function storeWall(idx) {
  const f = [1, .72, .48, .28];
  wallTex[idx] = f.map(k => {
    const out = new Uint32Array(TEX * TEX);
    for (let i = 0; i < out.length; i++) {
      const c = tmp[i];
      out[i] = RGB((c & 255) * k, ((c >> 8) & 255) * k, ((c >> 16) & 255) * k);
    }
    return out;
  });
}
const S = {}; ["BEAR0","BEAR1","SELL0","SELL1","BUB0","BUB1","SHARK0","SHARK1","BULL0","BULL1","BARON0","BARON1",
  "SLICK0","SLICK1","BOT0","BOT1","ALGO0","ALGO1","DEAD","PROJ","PROJ_OIL","LASER","CASH","DIV",
  "AVM0","AVM1","AVM2","AVM3","AVMBULL","AVMBEAR","AVF0","AVF1","AVF2","AVF3","AVFBULL","AVFBEAR",
  "PIR0","PIR1","PIR2","PIR3","PIR4","PIR5","NOTE","KEY","REFI","LIQ"].forEach((n, i) => S[n] = i);
const sprTex = [];
function storeSprite(idx) { sprTex[idx] = tmp.slice(); }
// Keycard des Levels: jede Tresortuer braucht ihre eigene Farbe
const KEY_COL = [[255, 210, 40], [60, 140, 255], [235, 50, 50], [50, 205, 90], [175, 80, 235]];
const KEY_EN = ["YELLOW", "BLUE", "RED", "GREEN", "PURPLE"], KEY_DE = ["GELBE", "BLAUE", "ROTE", "GRÜNE", "VIOLETTE"];
const keyColName = () => L(KEY_EN[level] || KEY_EN[0], KEY_DE[level] || KEY_DE[0]);
function makeKeySprite(lv) {
  const [r, g, b] = KEY_COL[lv] || KEY_COL[0];
  tclear(0);
  trect(5, 14, 22, 16, RGB(r * .5, g * .5, b * .5)); trect(6, 15, 20, 14, RGB(r, g, b));
  trect(6, 18, 20, 3, RGB(240, 240, 245)); trect(9, 23, 6, 4, RGB(230, 185, 60)); trect(10, 24, 4, 2, RGB(170, 130, 30));
  trect(18, 24, 6, 1, RGB(r * .5, g * .5, b * .5)); trect(18, 26, 4, 1, RGB(r * .5, g * .5, b * .5));
  tline(16, 14, 16, 8, RGB(40, 40, 50), 1); tcirc(16, 7, 2, RGB(40, 40, 50)); tcirc(16, 7, 1, 0);
  storeSprite(S.KEY);
}

function seriesRange(m, manip = true) {
  let lo = Infinity, hi = -Infinity;
  for (const v of m.s) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (manip && manipDrawn && m.s.length) { const v = manipSeries(m, m.s.length - 1); lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (hi - lo < 1e-6) hi = lo + 1;
  return [lo, hi];
}
// Von ALGO-9000 verbogener Verlauf: ab 60 % des Tages schrittweise auf den manipulierten Kurs
function manipSeries(m, i) {
  const n = m.s.length, a = Math.floor(n * .6);
  return m.s[i] * (1 + (i > a ? manipDrawn / 100 * (i - a) / Math.max(1, n - 1 - a) : 0));
}
const MANIP_COL = () => RGB(255, 60, 200);
function genTickerTex(m) {
  tclear(RGB(8, 12, 22));
  const up = m.chg >= 0;
  for (let x = 0; x < TEX; x++) for (let y = 2; y < 9; y++)
    if ((x % 8) < 6 && (rnd() % 3)) tpx(x, y, (((x >> 3) % 3) === 2) !== up ? RGB(40, 230, 90) : RGB(240, 50, 50));
  const [lo, hi] = seriesRange(m), n = m.s.length;
  for (let x = 0; x < TEX; x++) {
    const i = n > 1 ? Math.floor(x * (n - 1) / (TEX - 1)) : 0;
    const y = 29 - Math.floor((m.s[i] - lo) / (hi - lo) * 15);
    for (let yy = y + 1; yy < 31; yy++) tpx(x, yy, up ? RGB(10, 70, 35) : RGB(80, 15, 15));
    tpx(x, y, up ? RGB(80, 255, 130) : RGB(255, 80, 80));
  }
  const py = 29 - Math.floor((m.prev - lo) / (hi - lo) * 15);
  if (py >= 13 && py <= 30) for (let x = 0; x < TEX; x += 3) tpx(x, py, RGB(200, 200, 90));
  if (manipDrawn) for (let x = Math.floor(TEX * .6); x < TEX; x++) {
    const i = n > 1 ? Math.floor(x * (n - 1) / (TEX - 1)) : 0;
    tpx(x, clamp(29 - Math.floor((manipSeries(m, i) - lo) / (hi - lo) * 15), 12, 30), MANIP_COL());
  }
  for (let i = 0; i < TEX; i++) { tpx(i, 0, RGB(90, 90, 100)); tpx(i, 11, RGB(40, 40, 60)); tpx(i, 31, RGB(90, 90, 100)); }
  storeWall(T.TICKER);
}
function genChartTex(m) {
  tclear(RGB(225, 228, 235));
  for (let y = 4; y < 30; y += 6) trect(1, y, 30, 1, RGB(200, 205, 215));
  const [lo, hi] = seriesRange(m), n = m.s.length;
  const Y = v => 27 - Math.floor((v - lo) / (hi - lo) * 22);
  for (let k = 0; k < 7; k++) {
    const a = Math.floor(k * n / 7), b = Math.max(a + 1, Math.floor((k + 1) * n / 7));
    const o = m.s[a], c = m.s[b - 1]; let h = o, l = o;
    for (let i = a; i < b; i++) { h = Math.max(h, m.s[i]); l = Math.min(l, m.s[i]); }
    const x = 2 + k * 4;
    trect(x + 1, Y(h), 1, Y(l) - Y(h) + 1, RGB(60, 60, 60));
    let t = Y(Math.max(o, c)), bt = Y(Math.min(o, c)); if (bt - t < 1) bt = t + 1;
    trect(x, t, 3, bt - t, c >= o ? RGB(20, 170, 60) : RGB(220, 40, 40));
  }
  if (manipDrawn) for (let x = 17; x < 31; x++) {   // manipulierter Verlauf, doppelt so dick
    const i = Math.min(n - 1, Math.floor((x - 1) * n / 30)), y = clamp(Y(manipSeries(m, i)), 1, 29);
    tpx(x, y, MANIP_COL()); tpx(x, y + 1, MANIP_COL());
  }
  for (let i = 0; i < TEX; i++) { tpx(i, 0, RGB(50, 50, 60)); tpx(i, 31, RGB(50, 50, 60)); tpx(0, i, RGB(50, 50, 60)); tpx(31, i, RGB(50, 50, 60)); }
  storeWall(T.CHART);
}

function genWalls() {
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const n = Math.floor(frand() * 24) - 12;
    const v = Math.sin(x * .22 + y * .13 + 2.5 * Math.sin(y * .27 + x * .05));
    const base = 196 + n;
    let c = RGB(base, base - 8, base - 26);
    if (Math.abs(v) < .10) c = RGB(120 + n, 115 + n, 110 + n);
    if (y % 16 === 0 || ((x + (y >> 4) * 16) % 32) === 0) c = RGB(140, 130, 112);
    tmp[y * TEX + x] = c;
  }
  storeWall(T.MARBLE);

  tclear(RGB(42, 44, 50));
  for (let y = 0; y < TEX; y += 4) trect(1, y, 30, 1, RGB(20, 20, 24));
  const led = [RGB(40, 255, 80), RGB(60, 140, 255), RGB(255, 180, 30)];
  for (let y = 1; y < TEX; y += 4) {
    for (let x = 3; x < 20; x += 2) tpx(x, y + 1, RGB(28, 28, 32));
    for (let x = 23; x < 30; x += 2) if (rnd() % 2) tpx(x, y + 1, led[rnd() % 3]);
  }
  trect(0, 0, 1, 32, RGB(80, 80, 90)); trect(31, 0, 1, 32, RGB(15, 15, 18));
  storeWall(T.SERVER);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const row = y >> 3, ly = y % 8, lx = (x + (row % 2) * 8) % 16;
    let c;
    if (ly === 7 || lx === 15) c = RGB(80, 50, 10);
    else { const b = 255 - ly * 14 - Math.floor(frand() * 10); c = RGB(b, b * 3 / 4, 30); if (ly === 0) c = RGB(255, 240, 150); }
    tmp[y * TEX + x] = c;
  }
  storeWall(T.GOLD);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const n = rnd() % 12; tmp[y * TEX + x] = RGB(110 + n, 115 + n, 122 + n); }
  tcirc(16, 17, 13, RGB(70, 74, 80)); tcirc(16, 17, 11, RGB(150, 155, 162)); tcirc(16, 17, 4, RGB(60, 62, 68));
  tline(16, 17, 16, 8, RGB(220, 200, 80), 2); tline(16, 17, 8, 22, RGB(220, 200, 80), 2); tline(16, 17, 24, 22, RGB(220, 200, 80), 2);
  for (let a = 0; a < 8; a++) tpx(16 + Math.trunc(12 * Math.cos(a * .785)), 17 + Math.trunc(12 * Math.sin(a * .785)), RGB(40, 40, 40));
  trect(13, 1, 6, 2, RGB(40, 255, 90));
  storeWall(T.VAULT);

  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) { const n = rnd() % 14; tmp[y * TEX + x] = RGB(62 + n, 48 + n / 2, 36); }
  for (let p = 0; p < 2; p++) {
    const y0 = p ? 18 : 4;
    for (let y = 0; y < 9; y++) {
      const s = Math.sin((y + .5) / 9 * Math.PI), gg = 50 + Math.floor(130 * s);
      trect(0, y0 + y, 32, 1, p ? RGB(gg, gg * 2 / 3, gg / 3) : RGB(gg * 3 / 4, gg * 3 / 4, gg * 4 / 5));
    }
    for (const fx of [7, 23]) { trect(fx, y0 - 1, 3, 11, RGB(40, 40, 44)); tpx(fx + 1, y0 + 1, RGB(200, 200, 200)); tpx(fx + 1, y0 + 7, RGB(200, 200, 200)); }
  }
  for (let i = 0; i < 6; i++) { const x = rnd() % 32; trect(x, 13 + rnd() % 3, 1, 2 + rnd() % 4, RGB(10, 10, 12)); }

        else if (k === "f" && isHost() && net.connected) { lobbyFF = !lobbyFF; sfx("HIT"); hostSendLobby(); }
        else if (k === "n" && isHost() && net.connected) { lobbyNPC = !lobbyNPC; sfx("HIT"); hostSendLobby(); }
        else if (k === "d" && isHost() && net.connected) { lobbyDiff = (lobbyDiff + 1) % 3; sfx("HIT"); hostSendLobby(); }
        else if (k === "c" && isHost() && net.connected) { lobbyRes = (lobbyRes + 1) % 3; sfx("HIT"); hostSendLobby(); }
        else if (k === "l" && isHost() && net.connected && lobbyMode === 3) { lobbyLives = lobbyLives % 5 + 1; sfx("HIT"); hostSendLobby(); }
        else if (k === "r" && isHost() && net.connected && lobbyMode === 3) { lobbyBestOf = lobbyBestOf >= 9 ? 3 : lobbyBestOf + 2; sfx("HIT"); hostSendLobby(); }
        else if (k === "Escape" || k === "enter" || k === "s") { matchSetOpen = false; sfx("HIT"); }
        break;
      }
      if (k === "s" && net.connected) { matchSetOpen = true; sfx("HIT"); break; }
      if (k === "v" && isHost() && net.online && net.connected) { net.pub = !net.pub; settings.onlinePub = net.pub; saveSettings(); sfx("HIT"); hostSendLobby(); break; }   // oeffentlich <-> privat
      if (k === "Escape") { leaveMP(); break; }
      if (k === "o") { openOptions(); break; }
      if (isBound("chat", k) || k === "t") { chatTyping = true; chatText = ""; break; }
      if (k === "e" && !isHost()) { me.ready = !me.ready; netSend({ t: "ready", ready: me.ready }); sfx(me.ready ? "KACHING" : "HIT"); break; }
      if (k === "k") { editNick(); break; }
      if (k === "g" && isHost()) { editGameName(); break; }
      if (k === "y" && net.online && net.code) { copyCode(); break; }
      if (k === "c") {
        me.avatar = me.avatar === "f" ? "m" : "f"; settings.avatar = me.avatar; saveSettings(); sfx("HIT");
        if (isHost()) hostSendLobby(); else netSend({ t: "avatar", avatar: me.avatar });
      }
      if (k === "1" || k === "2") {
        if (isHost()) { me.team = k === "1" ? 0 : 1; hostSendLobby(); } else { me.team = k === "1" ? 0 : 1; netSend({ t: "team", team: me.team }); }
        sfx("HIT");
      }
      if (isHost() && net.connected) {
        if (k === "ArrowLeft" || k === "ArrowRight") { lobbyMode = (lobbyMode + (k === "ArrowLeft" ? MODES.length - 1 : 1)) % MODES.length; sfx("HIT"); hostSendLobby(); }
        if (k === "e") { if (allReady()) hostStartGame(); else { lobbyNote = L("NOT ALL PLAYERS ARE READY YET", "EINIGE MITSPIELER NOCH NICHT BEREIT"); lobbyNoteT = 2.5; sfx("DECLINED"); } }
      }
      break;
    case ST.PLAY:
      if ((isMP() || mode === "solo") && isBound("chat", k) && !isGhost()) { chatTyping = true; chatText = ""; keys.clear(); logOpen = false; break; }
      if (isBound("log", k)) { logOpen = !logOpen; logUntil = performance.now() + 10000; break; }
      dodgeTap(k);
      if (isBound("pause", k)) {
        if (isMP()) mpMenu = true; else state = ST.PAUSE;
        pausedAt = performance.now(); document.exitPointerLock?.();
      }
      break;
    case ST.MPMENU:
      if (k === "o") openOnline();
      else if (k === "k") editNick();
      else if (k === "h") enterLobby();
      else if (k === "j") { joinText = ""; joinSel = 0; gamesT = 0; foundGames = []; state = ST.JOIN; }
      else if (k === "Escape") state = ST.TITLE;
      break;
    case ST.TOUCHHELP:
      if (k === "enter" || k === "Escape" || k === " ") closeTouchHelp();
      break;
    case ST.PAUSE:
      if (k === "q") backToTitle();
      else if (k === "o") openOptions();
      else if (isBound("pause", k) || k === "enter" || k === "Escape") { if (k !== "Escape" || pauseAge() > .4) { state = ST.PLAY; lockMouse(); } }
      break;
    case ST.LEVELDONE:
      if (k === "enter" && isHost() && !(isMP() && roundT > 0)) {
        loadLevel(level + 1);
        players.forEach(p => { if (HC()) p.hp = Math.max(p.hp, 35); else { p.ammo = Math.max(p.ammo, 20); p.hp = Math.max(p.hp, 40); } });   // geschafftes Level lohnt sich
        state = ST.PLAY; fireCd = .4; lockMouse();
      }
      break;
    case ST.ROUNDEND:
      if (roundT > 0) break;   // erst die Statistik ansehen
      if (k === "enter" && isHost()) { if (mode === "lms" && lmsOver) backToLobby(); else { if (mode === "lms") lmsRound++; nextRound(); lockMouse(); } }
      if (k === "Escape") leaveMP();
      break;
    case ST.DEAD:
      if (HC() || outOfLives()) { if (k === "enter" || k === "h") finishRun(false); }   // Hardcore bzw. alle Leben weg: kein neuer Kredit
      else if (k === "enter") { me.score = Math.max(0, me.score - deathPenalty); deathPenalty = 0; me.hp = 100; me.ammo = Math.max(me.ammo, 30); loadLevel(level); state = ST.PLAY; fireCd = .4; lockMouse(); }
      else if (k === "h") finishRun(false);   // aufgeben: Lauf endet, Highscore eintragen
      break;
    case ST.CREDITS:
      if (k === "enter" || k === "Escape" || k === " ") creditsDone();
      break;
    case ST.OUTRO:
      if (k === "enter" || k === "Escape" || k === " ") state = ST.WIN;
      break;
    case ST.WIN:
      if (isMP() && roundT > 0) break;
      if (k === "enter" && isHost()) {
        if (isMP()) backToLobby();
        else if (islandDone) finishRun(true); else startCredits();
      }
      if (k === "Escape" && isMP()) leaveMP();
      break;
  }
}

// ---------------------------------------------------------------- Ausweichen (Doppeltipp)
const DODGE_WINDOW = .25, DODGE_TIME = .25, DODGE_SPEED = 7, DODGE_COOLDOWN = .6;
const DODGE_DIRS = { fwd: [1, 0], back: [-1, 0], strafeL: [0, -1], strafeR: [0, 1] };   // [vor, seitwaerts]
const lastTap = {};
let dodgeT = 0, dodgeCd = 0, dodgeX = 0, dodgeY = 0;
function dodgeTap(k) {
  const now = performance.now() / 1000;
  for (const a of Object.keys(DODGE_DIRS)) {
    if (!isBound(a, k)) continue;
    if (lastTap[a] && now - lastTap[a] < DODGE_WINDOW && dodgeCd <= 0 && dodgeT <= 0 && !me.dead) {
      let [f, s] = DODGE_DIRS[a];
      if (invertT > 0) s = -s;
      dodgeX = dirX * f - dirY * s; dodgeY = dirY * f + dirX * s;
      dodgeT = DODGE_TIME; dodgeCd = DODGE_TIME + DODGE_COOLDOWN;
      sfx("DODGE");
      lastTap[a] = 0;
    } else lastTap[a] = now;
  }
}

function updateGame(dt) {
  if (readyT > 0) {   // Countdown: alles eingefroren
    readyT -= dt; mouseTurn = 0;
    if (readyT <= 0) { if (isClient()) readyT = 0; else levelGo(); }

  }
  gameTime += dt; musicPanic = !me.dead && me.hp < 30;
  for (const p of hurtPops) p.t += dt;
  hurtPops = hurtPops.filter(p => p.t < 1.1);
  faceT -= dt; if (faceT <= 0) { faceT = 1.2 + Math.random() * 2.5; faceLook = Math.random() < .5 ? 0 : Math.random() < .5 ? -1 : 1; }
  fireCd -= dt; flashT -= dt; hurtT -= dt; pickT -= dt; msgT -= dt; dodgeCd -= dt;
  aiFaceT -= dt; crashT -= dt; glitchT -= dt; invertT -= dt; quakeT -= dt;
  if (fakeT > 0) { fakeT -= dt; if (fakeT <= 0 || (Math.floor(gameTime * 4) % 2)) buildTicker(); }
  if (manipT > 0) {

    if (dumpAt && manipT <= dumpAt && !isClient()) { dumpAt = 0; manipChg = -manipChg; sayAll(`ALGO-9000: DUMP!  ${L("PRICE", "KURS")} ${fmtChg(manipChg)}`, 2.5); sfxAll("GLITCH"); aiFaceT = 2.2; glitchT = Math.max(glitchT, .6); }
    marketEffect();

  if (isGhost() && chatTyping) { chatTyping = false; chatText = ""; }   // Geister koennen nicht chatten
  // lokale Steuerung
  if (!me.dead || isGhost()) {
    const mv = (isGhost() ? 3.6 : 2.8 * playerSpeedMul(me)) * dt, rot = 2.4 * dt;
    let fwd = 0, side = 0, turn = 0;
    if (down("fwd")) fwd += 1;
    if (down("back")) fwd -= 1;
    if (down("turnL")) turn -= 1;
    if (down("turnR")) turn += 1;
    if (down("strafeL")) side -= 1;
    if (down("strafeR")) side += 1;
    fwd += touchMv.y; side += touchMv.x;
    let ang = turn * rot + mouseTurn * .0006 * settings.sens;
    if (invertT > 0) { ang = -ang; side = -side; }
    aimHoldT -= dt; aimLocked = false;
    if (aimAssistOn() && (touchFire || aimHoldT > 0)) {   // beim Feuern sanft zum Ziel drehen (wie eine Zielhilfe am Controller)

      if (t) {

        diff = Math.atan2(Math.sin(diff), Math.cos(diff));

    }

      const l = Math.hypot(mx, my); mx = mx / l * mv; my = my / l * mv;

    }
    if (dodgeT > 0) {

      tryMove(dodgeX * v, dodgeY * v); bobT += dt * 20;
      dodgeT -= dt;
    }
  } else dodgeT = 0;
  mouseTurn = 0;
  me.x = px; me.y = py; me.dirX = dirX; me.dirY = dirY;
  for (const pl of players) {   // Laufrichtung der Spieler (geglaettet), damit Hardcore-Schuetzen vorhalten koennen
    let vx = (pl.x - (pl.ox ?? pl.x)) / Math.max(dt, 1e-3), vy = (pl.y - (pl.oy ?? pl.y)) / Math.max(dt, 1e-3);
    if (Math.abs(vx) > 6 || Math.abs(vy) > 6) vx = vy = 0;   // Sprung (Respawn, Levelstart)
    pl.vx = (pl.vx || 0) * .7 + vx * .3; pl.vy = (pl.vy || 0) * .7 + vy * .3; pl.ox = pl.x; pl.oy = pl.y;
  }

  if (isClient()) {   // Mitspieler: nur Position melden, den Rest rechnet der Host
    if (performance.now() - lastSent > (net.online ? 100 : 45)) { lastSent = performance.now(); netSend({ t: "me", x: r2(px), y: r2(py), dx: +dirX.toFixed(3), dy: +dirY.toFixed(3) }); }
    me.slowT -= dt; stepMyShots(dt);

  // ---- ab hier: Solo oder Host
  for (const pl of players) {
    pl.slowT -= dt;
    if (pl.stampHitT > 0) pl.stampHitT -= dt;
    if (pl.dead && isMP()) { pl.respawnT -= dt; if (pl.respawnT <= 0) respawnPlayer(pl); }
  }
  checkExit();
  if (state !== ST.PLAY) return;

  for (const it of items) {
    if (!it.active || it.slide) continue;
    for (const pl of players) {
      if (pl.dead || (pl.x - it.x) ** 2 + (pl.y - it.y) ** 2 > .3) continue;
      if (it.type === 2) { it.active = false; islandCoin(pl); break; }   // Goldmuenze in der Steueroase
      if (it.type === 3) { it.active = false; hasKey = true; sayAll(L(`${keyColName()} KEYCARD! THE VAULT IS OPEN`, `${keyColName()} KEYCARD! DER TRESOR IST OFFEN`), 2.5); sfxAll("KEYCARD"); break; }
      if (it.crash) { it.active = false; addScore(pl, 150); pl.ammo = Math.min(99, pl.ammo + 5); sayTo(pl, L("FIRE SALE +$150", "NOTVERKAUF +$150"), 1); if (pl.local) pickT = .25; else emit(["pick", pl.id]); sfxTo(pl, "KACHING"); break; }
      if (it.type === 5) {   // Liquiditaetsschub: viel Cash, etwas Depot
        if (pl.ammo >= 99) continue;
        it.active = false; const n = resHC() ? 45 : 60, h = resHC() ? 5 : 10; pl.ammo = Math.min(99, pl.ammo + n); pl.hp = Math.min(100, pl.hp + h); addScore(pl, 100);
        sayTo(pl, L(`LIQUIDITY BOOST! CASH +${n} · PORTFOLIO +${h} %`, `LIQUIDITÄTSSCHUB! CASH +${n} · DEPOT +${h} %`), 2.5);
        if (pl.local) pickT = .25; else emit(["pick", pl.id]); sfxTo(pl, "LIQ"); break;
      }
      if (it.type === 4) {   // Refinanzierungspaket: Depot voll, dazu Cash
        if (pl.hp >= 100) continue;
        it.active = false; pl.hp = 100; const n = resHC() ? 15 : 20; pl.ammo = Math.min(99, pl.ammo + n); addScore(pl, 100);
        sayTo(pl, L(`REFINANCING PACKAGE! PORTFOLIO 100 % · CASH +${n}`, `REFINANZIERUNGSPAKET! DEPOT 100 % · CASH +${n}`), 2.5);
        if (pl.local) pickT = .25; else emit(["pick", pl.id]); sfxTo(pl, "REFI"); break;
      }
      if (it.type === 0) { if (pl.ammo >= 99) continue; const n = resHC() ? 7 : 10; pl.ammo = Math.min(99, pl.ammo + n); sayTo(pl, `CASHFLOW +${n}`, 1.2); }
      else { if (pl.hp >= 100) continue; const n = resHC() ? 15 : 20; pl.hp = Math.min(100, pl.hp + n); sayTo(pl, `${L("DIVIDEND PAID", "DIVIDENDE AUSGESCHÜTTET")} +${n} %`, 1.2); }
      it.active = false; addScore(pl, 25);
      if (pl.local) pickT = .25; else emit(["pick", pl.id]);
      sfxTo(pl, it.type === 0 ? "KACHING" : "COINS");
      break;
    }
  }
  items = items.filter(i => i.active);
  if (island) { updateIsland(dt); return; }

  replayT -= dt;
  const m = levelMarket();
  if (replayT <= 0 && m.s.length > 3) {
    replayT = 3; replayIdx = (replayIdx + 1) % m.s.length;
    const i0 = Math.max(0, replayIdx - 3);
    momentum = (m.s[replayIdx] - m.s[i0]) / m.s[i0] * 100;
  }
  updatePhase(dt); updateNav(dt); levelTime += dt;
  attackers = null;
  if (nEZ()) {   // Kleinanleger: nur wenige Gegner greifen gleichzeitig an (je nach Level), die naechsten zuerst
    const dist = e => Math.min(1e9, ...players.filter(p => !p.dead).map(p => (p.x - e.x) ** 2 + (p.y - e.y) ** 2));
    attackers = new Set(enemies.filter(e => e.alive && !e.gone && e.awake && e.pir === undefined && !TYPES[e.type].boss && (!(e.f === F.BULL || e.f === F.BEAR) || (e.target && e.target.isPlayer)))
      .sort((a, b) => dist(a) - dist(b)).slice(0, attackSlots()));
  }

  for (const e of enemies) {

  }
  spawnT -= dt;

    spawnT = (7 + frand() * 5) / (1 + .5 * extraPl);
    if (bullsAlive + bearsAlive < 9 + (mode === "coop" ? 4 * extraPl : 2 * (players.length - 1))) {
      const c = findHiddenCell(5);
      if (c) spawnEnemy(frand() < clamp(pBullBase + momentum * 1.5 + (phaseT > 0 ? phase * .25 : 0), .1, .9) ? E.BULL : E.BEAR, c[0], c[1]);
    }
  }
  // vereinzeltes Bargeld abseits der Spieler, damit niemand ganz ohne Munition dasteht;

  if (cashT <= 0) {

    if (items.filter(i => i.active && i.stray).length < Math.max(1, Math.round(2 * resMul().n))) {
      const c = findHiddenCell(6);
      if (c) items.push({ x: c[0], y: c[1], type: 0, active: true, stray: true });
    }
  }
  if (noNPC() && (freeT -= dt) <= 0) {
    freeT = (8 + frand() * 6) * resMul().t;
    if (items.filter(i => i.active && i.free).length < Math.round((2 + players.length) * resMul().n)) {
      const c = findHiddenCell(4), hurt = players.some(p => !p.dead && p.hp < 50);

  }

  for (const p of projs) {

      damagePlayer(pl, p.dmg, p.spr === S.LASER ? L("ALGO ORDER EXECUTED!", "ALGO-ORDER AUSGEFÜHRT!") : p.spr === S.PROJ_OIL ? L("OIL BARREL! ENERGY CRISIS", "ÖLFASS! ENERGIEKRISE") : "MARGIN CALL!");

    }

  // Runden-Ende im Team- und Deathmatch-Modus
  if (mode === "team" || mode === "dm") {
    roundT -= dt;
    const done = mode === "team" ? teamScore[0] >= teamTarget(0) || teamScore[1] >= teamTarget(1) : Math.max(...players.map(p => p.score)) >= ROUND_TARGET;
    if (roundT <= 0 || done) {
      state = ST.ROUNDEND; roundT = ROUND_BREAK; musicStop(); emit(["music", 0]); sfxAll("BELL"); document.exitPointerLock?.();
    }
  }
  if (mode === "lms" && players.length >= 1) {   // Last Man Standing: nur noch einer (oder keiner) uebrig
    const alive = players.filter(p => !p.out);
    if (alive.length <= 1 && (players.length >= 2 || !alive.length)) lmsEnd(alive[0] || null);
  }
  if (isMP() && net.connected) recordTrails();
  if (isMP() && performance.now() - lastSent > (net.online ? 100 : 50)) { lastSent = performance.now(); hostSendSnapshot(); }
}

// ---------------------------------------------------------------- Rendering
const rowColor = new Uint32Array(VH);
for (let y = 0; y < VH; y++) {
  if (y < VH / 2) { const t = y / (VH / 2); rowColor[y] = RGB(40 - 30 * t, 36 - 28 * t, 44 - 32 * t); }
  else { const t = (y - VH / 2) / (VH / 2); rowColor[y] = RGB(18 + 100 * t, 6 + 18 * t, 8 + 20 * t); }
}
function renderWalls() {
  for (let y = 0; y < VH; y++) fb.fill(rowColor[y], y * RW, (y + 1) * RW);
  const scroll = Math.floor(gameTime * 10) & 31;
  for (let x = 0; x < RW; x++) {
    const cam = 2 * x / RW - 1, rdx = dirX + planeX * cam, rdy = dirY + planeY * cam;
    let mx = Math.floor(px), my = Math.floor(py);
    const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx), ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
    let stepX, stepY, sdx, sdy;
    if (rdx < 0) { stepX = -1; sdx = (px - mx) * ddx; } else { stepX = 1; sdx = (mx + 1 - px) * ddx; }
    if (rdy < 0) { stepY = -1; sdy = (py - my) * ddy; } else { stepY = 1; sdy = (my + 1 - py) * ddy; }
    let side = 0, cell = "#";
    for (let i = 0; i < 64; i++) {
      if (sdx < sdy) { sdx += ddx; mx += stepX; side = 0; } else { sdy += ddy; my += stepY; side = 1; }
      if (mx < 0 || my < 0 || mx >= MAP || my >= MAP) break;
      if (world[my][mx] !== ".") { cell = world[my][mx]; break; }
    }
    let perp = side === 0 ? sdx - ddx : sdy - ddy; if (perp < .05) perp = .05;
    zbuf[x] = perp;

function chartBackground(up, down) {
  g.fillStyle = "#060a14"; g.fillRect(0, 0, DW, DH);
  g.strokeStyle = "#121a2c"; g.lineWidth = 1;

  const m = markets[M_SPX], [lo, hi] = seriesRange(m, false), n = m.s.length;
  const K = Math.ceil(DW / 24) + 1, shift = gameTime * 60, off = shift % 24;
  for (let k = 0; k < K; k++) {
    const idx = (k + Math.floor(shift / 24)) % Math.max(1, n - 1);
    const o = m.s[idx], c = m.s[Math.min(idx + 1, n - 1)];
    const yo = 470 - (o - lo) / (hi - lo) * 380, yc = 470 - (c - lo) / (hi - lo) * 380;
    const x = k * 24 - off;
    g.fillStyle = c >= o ? up : down;
    g.fillRect(x + 7, Math.min(yo, yc) - 10, 2, Math.abs(yo - yc) + 20);
    g.fillRect(x, Math.min(yo, yc), 16, Math.max(4, Math.abs(yo - yc)));
  }
}

function musicSchedule() {

const CODE_CHARS = "ABCDEFGJLMNQRSTUVWXYZ23456789";   // ohne H, K, P (Tastenkuerzel), O/0 und I/1
let onlineRooms = [], onlineSel = 0, codeText = "", roomsT = 0, onlineBack = ST.TITLE;

function onlineKey(k) {
  if (codeAsk) {
    if (k === "Escape") { codeAsk = false; codeText = ""; return; }
    if (k === "Backspace") { codeText = codeText.slice(0, -1); return; }
    if (k === "enter") { if (codeText.length === 5) { codeAsk = false; joinOnline(codeText); } return; }
    const c = k.length === 1 ? k.toUpperCase() : "";
    if (c && CODE_CHARS.includes(c) && codeText.length < 5) codeText += c;
    return;
  }
  if (k === "Escape") { state = onlineBack; return; }
  if (k.startsWith("room:")) { const r = onlineRooms[+k.slice(5)]; if (r) joinOnline(r.code); return; }
  if (k === "ArrowUp") { onlineSel = Math.max(0, onlineSel - 1); return; }
  if (k === "ArrowDown") { onlineSel = Math.min(Math.max(0, Math.min(6, onlineRooms.length) - 1), onlineSel + 1); return; }
  if (k === "enter") { if (onlineRooms[onlineSel]) joinOnline(onlineRooms[onlineSel].code); return; }
  if (k === "h") hostOnline(settings.onlinePub !== false);   // zuletzt gewaehlte Sichtbarkeit, sonst oeffentlich
  else if (k === "j") { codeAsk = true; codeText = ""; }
  else if (k === "k") editNick();
}

function joinTo(addr) {
  const host = addr.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  if (!host) return;
  location.href = appUrl(`http://${host.includes(":") ? host : host + ":8080"}`, "&join=1");
}
function joinKey(k) {
  if (k === "Escape") { state = ST.MPMENU; return; }
  if (k.startsWith("game:")) { const gm = foundGames[+k.slice(5)]; if (gm) joinTo(gm.addr); return; }
  if (k === "ArrowUp") { joinSel = Math.max(0, joinSel - 1); return; }
  if (k === "ArrowDown") { joinSel = Math.min(Math.max(0, Math.min(5, foundGames.length) - 1), joinSel + 1); return; }
  if (k === "Backspace") { joinText = joinText.slice(0, -1); return; }
  if (k === "enter") {
    if (joinText.trim()) joinTo(joinText);
    else if (foundGames[joinSel]) joinTo(foundGames[joinSel].addr);
    return;
  }
  if (k.length === 1 && /[0-9a-z.:\-]/.test(k) && joinText.length < 40) joinText += k;
}

// ---------------------------------------------------------------- Hauptschleife
let last = performance.now(), lobbyT = 0;
// Bildschirm-Richtung zu einem Punkt (Einheitsvektor): vorne = oben, rechts = rechts
function screenDir(x, y) {

  return [(sx * planeX + sy * planeY) / (l * pl), -(sx * dirX + sy * dirY) / l];
}
// Treffer- und Gefahrenanzeige werden in der groben Aufloesung der Spielwelt gezeichnet (4 Bildpunkte je Pixel), damit sie zum Pixel-Look passen
const FX_SC = 4; let fxCv = null, fxG = null;
function fxBegin() {
  const w = Math.ceil(DW / FX_SC), h = Math.ceil(HUD_Y / FX_SC);
  if (!fxCv || fxCv.width !== w || fxCv.height !== h) { fxCv = document.createElement("canvas"); fxCv.width = w; fxCv.height = h; fxG = fxCv.getContext("2d"); }

}
function fxEnd() {   // harte Pixelkanten, Transparenz in wenigen Stufen

// Trefferrichtung: duenner roter Pixelbogen mit dunklem Rand um das Fadenkreuz, dreht sich beim Umdrehen mit; starke Treffer lassen den Bildrand gluehen
function renderHitDirs(dt) {
  hitDirs = hitDirs.filter(h => (h.t -= dt) > 0);
  if (!hitDirs.length || settings.hitDir === false) return;
  const x = fxBegin(), cx = fxCv.width / 2, cy = fxCv.height / 2, r = Math.min(110, HUD_Y * .3) / FX_SC;
  for (const pass of [0, 1]) for (const h of hitDirs) {   // erst alle dunklen Raender, dann die roten Linien
    const [vx, vy] = screenDir(h.x, h.y), ang = Math.atan2(vy, vx), span = .36 * (.75 + .25 * h.k), lw = 1 + h.k, al = Math.min(1, h.t / .5);
    x.strokeStyle = pass ? `rgba(255,40,40,${al})` : `rgba(40,0,0,${al})`; x.lineWidth = pass ? lw : lw + 2;
    x.beginPath(); x.arc(cx, cy, r, ang - span, ang + span); x.stroke();
  }
  fxEnd();
  for (const h of hitDirs) if (h.k >= .6 && h.t > .6) {   // starker Treffer: Bildrand in dieser Richtung glueht
    const [vx, vy] = screenDir(h.x, h.y), al = Math.min(1, h.t / .5), side = Math.abs(vx) > Math.abs(vy), sg = side ? Math.sign(vx) : Math.sign(vy), W = 64;
    for (let k = 0; k < 4; k++) {   // in vier Stufen statt weichem Verlauf
      g.fillStyle = `rgba(255,30,30,${(.45 - k * .1) * al})`; const o = k * W / 4;
      if (side) g.fillRect(sg > 0 ? DW - o - W / 4 : o, 0, W / 4, HUD_Y); else g.fillRect(0, sg > 0 ? HUD_Y - o - W / 4 : o, DW, W / 4);
    }

}
// Geraeuschanzeige fuer alle, die ohne Ton spielen: Gegner-Geraeusche leuchten als gelber Abschnitt auf dem aeusseren Kreis auf.
// Nahe Geraeusche schmal und hell (unter 3 Feldern mit hellem Kern), ferne breit und schwaecher – die Richtung wirkt dann diffuser.
const SOUND_CUES = new Set(["ROAR", "BULL", "ZAP", "LASER", "OIL", "POP"]);
let soundCues = [];
function addSoundCue(x, y) {
  const old = soundCues.find(c => (c.x - x) ** 2 + (c.y - y) ** 2 < 2);
  if (old) { old.x = x; old.y = y; old.t = 1.5; return; }
  soundCues.push({ x, y, t: 1.5 }); if (soundCues.length > 8) soundCues.shift();
}
function renderSounds(dt) {
  soundCues = soundCues.filter(c => (c.t -= dt) > 0);
  if (!soundCues.length || settings.soundViz === false || !me || me.dead) return;
  const x = fxBegin(), cx = fxCv.width / 2, cy = fxCv.height / 2, R = Math.min(175, HUD_Y * .4) / FX_SC, N = 96;
  const cs = soundCues.map(c => { const [sx, sy] = screenDir(c.x, c.y), d = Math.hypot(c.x - px, c.y - py), f = Math.min(1, c.t / .6);
    return { a: Math.atan2(sy, sx), d, f, inten: Math.max(.6, 1 - d / 14) * f, sp: .12 + .05 * Math.min(d, 14) }; });

  }

    if (c.d < 3) { x.strokeStyle = `rgba(40,30,0,${c.f})`; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, R, c.a - .1, c.a + .1); x.stroke(); }
    x.strokeStyle = c.d < 3 ? `rgba(255,240,160,${c.f})` : `rgba(255,240,160,${.6 * c.f})`; x.lineWidth = 2; x.beginPath(); x.arc(cx, cy, R, c.a - .08, c.a + .08); x.stroke();

}
function renderReady() {

}
function renderPlay(dt) {
  if (island) renderIsland(); else { marketVisuals(); renderWalls(); renderSprites(); renderGlitch(); renderFlicker(); }
  renderPsy();
  const hk = hurtT > 0 ? Math.min(1, hurtT / .35) * Math.min(1, .45 + hurtAmt / 40) : 0;

    const c = fb[i], r = c & 255, gg = (c >> 8) & 255, b = (c >> 16) & 255, k = hk * .65;
    fb[i] = RGB(r + (255 - r) * k, gg * (1 - k), b * (1 - k));

  const shx = (hk > 0 ? (Math.random() - .5) * 16 * hk : 0) + (Math.random() - .5) * 9 * qk, shy = (hk > 0 ? (Math.random() - .5) * 10 * hk : 0) + (Math.random() - .5) * 7 * qk;

  g.drawImage(low, 0, 0, RW, VH, shx, shy, DW, HUD_Y);

    gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.8)"); g.fillStyle = gr; g.fillRect(0, 0, DW, HUD_Y);
    if (crashStage === 1) text(`${L("TRADING HALT", "HANDELSSTOPP")}  ${Math.ceil(crashStT)}`, DW / 2, 120, "#ff5050", 34, "center");
    else {
      const w = 420, x = (DW - w) / 2, y = 112, k = Math.min(1, marginPaid / Math.max(1, marginDue));
      g.fillStyle = "rgba(0,0,0,.65)"; g.fillRect(x - 6, y - 6, w + 12, 46);
      text(`MARGIN CALL  $${Math.min(marginPaid, marginDue).toLocaleString(LOC())} / $${marginDue.toLocaleString(LOC())}  ·  ${Math.ceil(crashStT)} s`, DW / 2, y - 2, "#ffc828", 16, "center");
      g.fillStyle = "#3a0a0a"; g.fillRect(x, y + 22, w, 12); g.fillStyle = Math.floor(gameTime * 4) % 2 && crashStT < 6 ? "#ff5050" : "#ffc828"; g.fillRect(x, y + 22, w * k, 12);
    }

}
function frame(now) {
